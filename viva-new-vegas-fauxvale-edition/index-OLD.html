<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Viva New Vegas - Fauxvale Edition - Installation Guide</title>
<!-- Sets data-crt before first paint so FX never flash on when disabled. -->
<script src="crt.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="crt.css" />
<style>
  :root {
    /* Vault-Tec amber terminal palette */
    --phosphor: #ffb642;
    --phosphor-dim: #b9741a;
    --phosphor-glow: rgba(255, 182, 66, 0.65);
    --phosphor-faint: rgba(255, 182, 66, 0.14);
    --amber: #ffdf9e;
    --screen: #140a02;
    --screen-deep: #0a0500;
    --bezel: #1c1108;
    /* crt.css overrides these when FX are toggled off. */
    --glow: 1;
    --font-display: "Fixedsys", "VT323", monospace;
    --display-scale: 1;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
  }

  body {
    background: radial-gradient(ellipse at center, #1b0d06 0%, #0a0500 70%, #000 100%);
    color: var(--phosphor);
    font-family: "Share Tech Mono", monospace;
    min-height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  /* The CRT screen container */
  .terminal {
    position: relative;
    width: min(920px, 100%);
    min-height: min(620px, 88vh);
    padding: clamp(28px, 6vw, 72px);
    background:
      radial-gradient(ellipse at center, rgba(48, 28, 8, 0.9) 0%, var(--screen) 60%, var(--screen-deep) 100%);
    border-radius: 22px;
    box-shadow:
      0 0 0 3px var(--bezel),
      0 0 0 14px #100a05,
      0 0 0 15px rgba(255, 182, 66, 0.08),
      0 30px 90px rgba(0, 0, 0, 0.9),
      inset 0 0 120px rgba(0, 0, 0, 0.9),
      inset 0 0 60px rgba(255, 182, 66, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    animation: flicker 5s infinite steps(60);
  }

  /* Curved-glass vignette */
  .terminal::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, 0.55) 100%);
    pointer-events: none;
    z-index: 3;
  }

  /* Scanlines + flowing scan sweep */
  .terminal::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 22px;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.28) 3px,
        rgba(0, 0, 0, 0.28) 4px
      );
    pointer-events: none;
    z-index: 4;
    mix-blend-mode: multiply;
  }

  /* Moving horizontal scan glow */
  .scan-sweep {
    position: absolute;
    left: 0;
    right: 0;
    height: 140px;
    top: -140px;
    background: linear-gradient(to bottom, transparent, rgba(255, 182, 66, 0.10), transparent);
    pointer-events: none;
    z-index: 5;
    animation: sweep 6s linear infinite;
  }

  .content {
    position: relative;
    z-index: 2;
    width: 100%;
  }

  .status-bar {
    position: absolute;
    top: clamp(14px, 3vw, 26px);
    left: clamp(20px, 5vw, 44px);
    right: clamp(20px, 5vw, 44px);
    display: flex;
    justify-content: space-between;
    font-size: clamp(11px, 1.5vw, 15px);
    letter-spacing: 0.15em;
    color: var(--phosphor-dim);
    text-shadow: 0 0 calc(6px * var(--glow)) var(--phosphor-glow);
    z-index: 6;
  }

  .title {
    font-family: var(--font-display);
    line-height: 0.92;
    text-shadow:
      0 0 calc(8px * var(--glow)) var(--phosphor-glow),
      0 0 calc(24px * var(--glow)) var(--phosphor-glow),
      0 0 calc(48px * var(--glow)) rgba(255, 182, 66, 0.4);
    margin: 0;
  }

  .title .line1 {
    display: block;
    font-size: calc(clamp(42px, 10vw, 100px) * var(--display-scale));
    letter-spacing: 0.02em;
  }

  .title .line2 {
    display: block;
    font-size: calc(clamp(30px, 7.5vw, 74px) * var(--display-scale));
    color: var(--amber);
    text-shadow:
      0 0 calc(8px * var(--glow)) rgba(255, 182, 66, 0.7),
      0 0 calc(24px * var(--glow)) rgba(255, 182, 66, 0.5),
      0 0 calc(48px * var(--glow)) rgba(255, 182, 66, 0.3);
    letter-spacing: 0.04em;
    margin-top: 0.08em;
  }

  .divider {
    width: min(420px, 80%);
    height: 2px;
    margin: clamp(22px, 4vw, 40px) auto clamp(16px, 3vw, 26px);
    background: linear-gradient(to right, transparent, var(--phosphor-dim), transparent);
    box-shadow: 0 0 calc(8px * var(--glow)) var(--phosphor-glow);
  }

  .subtitle {
    font-family: "Share Tech Mono", monospace;
    font-size: clamp(15px, 3vw, 26px);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    margin: 0 0 clamp(30px, 6vw, 52px);
    color: var(--phosphor);
    text-shadow: 0 0 calc(8px * var(--glow)) var(--phosphor-glow);
    text-transform: uppercase;
  }

  .subtitle-below {
    margin: clamp(30px, 6vw, 52px) 0 0;
  }

  .subtitle-tagline {
    font-size: clamp(11px, 2vw, 16px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    margin-top: clamp(22px, 4vw, 40px);
  }

  .begin-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.6em;
    font-family: var(--font-display);
    font-size: calc(clamp(26px, 5vw, 44px) * var(--display-scale));
    letter-spacing: 0.08em;
    padding: clamp(12px, 2vw, 18px) clamp(30px, 6vw, 58px);
    color: var(--screen-deep);
    background: var(--phosphor);
    border: 3px solid var(--phosphor);
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    box-shadow:
      0 0 calc(12px * var(--glow)) var(--phosphor-glow),
      0 0 calc(32px * var(--glow)) rgba(255, 182, 66, 0.4);
    transition: transform 0.08s ease, box-shadow 0.2s ease, background 0.2s ease;
    animation: pulse 2.4s ease-in-out infinite;
  }

  .begin-btn::before {
    content: "▶";
    font-size: 0.7em;
  }

  .begin-btn:hover,
  .begin-btn:focus-visible {
    background: var(--amber);
    border-color: var(--amber);
    outline: none;
    box-shadow:
      0 0 calc(16px * var(--glow)) rgba(255, 182, 66, 0.8),
      0 0 calc(44px * var(--glow)) rgba(255, 182, 66, 0.45);
  }

  .begin-btn:active {
    transform: translateY(2px) scale(0.98);
  }

  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--phosphor);
    margin-left: 0.15em;
    vertical-align: -0.12em;
    box-shadow: 0 0 calc(8px * var(--glow)) var(--phosphor-glow);
    animation: blink 1.1s steps(2) infinite;
  }

  @keyframes blink {
    0%, 50% { opacity: 1; }
    50.01%, 100% { opacity: 0; }
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 calc(12px * var(--glow)) var(--phosphor-glow), 0 0 calc(32px * var(--glow)) rgba(255, 182, 66, 0.35); }
    50% { box-shadow: 0 0 calc(20px * var(--glow)) var(--phosphor-glow), 0 0 calc(52px * var(--glow)) rgba(255, 182, 66, 0.6); }
  }

  @keyframes sweep {
    0% { top: -140px; }
    100% { top: 100%; }
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    96% { opacity: 1; }
    97% { opacity: 0.82; }
    98% { opacity: 1; }
    99% { opacity: 0.9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .terminal, .begin-btn, .scan-sweep, .cursor { animation: none; }
  }
</style>
</head>
<body>
  <button type="button" class="crt-toggle" aria-pressed="true" title="Toggle CRT / phosphor effects">
    <span class="led" aria-hidden="true"></span>
    <span>FX <span class="state"></span></span>
  </button>

  <main class="terminal">
    <div class="scan-sweep" aria-hidden="true"></div>
    <div class="status-bar" aria-hidden="true">
      <span>ROBCO INDUSTRIES (TM) TERMLINK</span>
      <span>VER 1.0</span>
    </div>

    <div class="content">
      <h1 class="title">
        <span class="line1">Viva New Vegas</span>
        <span class="line2">Fauxvale Edition</span>
      </h1>

      <p class="subtitle subtitle-tagline">A fun and flexible addon for Viva New Vegas</p>

      <a href="base-game.html" class="begin-btn">Begin Again</a>

      <p class="subtitle subtitle-below">Installation Guide<span class="cursor" aria-hidden="true"></span></p>
    </div>
  </main>
</body>
</html>
