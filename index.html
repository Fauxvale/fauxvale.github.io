<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fauxvale — Hello World!!</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --pink: #ff7bac;
    --pink-soft: #ffd6e7;
    --lilac: #b39ddb;
    --lilac-soft: #e6dcf7;
    --mint: #7ed0b8;
    --mint-soft: #d5f2e8;
    --blue: #6ec1e4;
    --blue-soft: #d6eefb;
    --ink: #4a3b52;
    --ink-soft: #7a6a82;
    --card: #fffdf9;
    --page: #fbeef6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    font-family: "Quicksand", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 15% 20%, var(--lilac-soft) 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, var(--blue-soft) 0%, transparent 40%),
      radial-gradient(circle at 80% 85%, var(--mint-soft) 0%, transparent 45%),
      radial-gradient(circle at 20% 90%, var(--pink-soft) 0%, transparent 45%),
      var(--page);
  }

  .card {
    width: 100%;
    max-width: 620px;
    background: var(--card);
    border: 3px solid var(--pink);
    border-radius: 28px;
    box-shadow: 0 10px 0 rgba(255, 123, 172, 0.25), 0 18px 40px rgba(74, 59, 82, 0.15);
    padding: 40px 36px;
    text-align: center;
  }

  .badge {
    display: inline-block;
    font-family: "Space Mono", "Courier New", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    background: var(--lilac-soft);
    color: var(--lilac);
    border: 2px dashed var(--lilac);
    border-radius: 999px;
    padding: 5px 14px;
    margin-bottom: 20px;
  }

  h1 {
    font-family: "Space Mono", "Courier New", monospace;
    font-size: clamp(2.4rem, 8vw, 3.4rem);
    margin: 0 0 4px;
    color: var(--pink);
    text-shadow: 3px 3px 0 var(--lilac-soft);
  }

  .blink {
    animation: blink 1.1s steps(2, start) infinite;
    color: var(--mint);
  }
  @keyframes blink { to { visibility: hidden; } }

  .intro {
    font-size: 1.1rem;
    line-height: 1.7;
    margin: 12px auto 4px;
    max-width: 480px;
  }
  .intro .accent { color: var(--pink); font-weight: bold; }

  .section-title {
    font-family: "Space Mono", "Courier New", monospace;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 34px 0 16px;
    position: relative;
  }
  .section-title::before,
  .section-title::after {
    content: "";
    display: inline-block;
    width: 40px;
    height: 2px;
    vertical-align: middle;
    margin: 0 10px;
    background: var(--pink-soft);
  }

  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }

  .link-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: "Space Mono", "Courier New", monospace;
    font-size: 0.95rem;
    font-weight: bold;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    border: 2.5px solid var(--ink);
    border-radius: 16px;
    padding: 11px 18px;
    box-shadow: 4px 4px 0 var(--btn-shadow, var(--pink));
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .link-btn:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--btn-shadow, var(--pink));
  }
  .link-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--btn-shadow, var(--pink));
  }
  .link-btn .icon { width: 20px; height: 20px; flex-shrink: 0; display: block; }

  .yt { --btn-shadow: var(--pink); }
  .steam { --btn-shadow: var(--blue); }
  .discord { --btn-shadow: var(--lilac); }

  .subpages {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  .subpage-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    font-weight: bold;
    color: var(--ink);
    background: var(--mint-soft);
    border: 2.5px solid var(--mint);
    border-radius: 18px;
    padding: 13px 22px;
    box-shadow: 4px 4px 0 var(--mint);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .subpage-link:hover {
    transform: translate(-2px, -2px);
    box-shadow: 6px 6px 0 var(--mint);
  }
  .subpage-link .arrow { color: var(--mint); }

  footer {
    margin-top: 34px;
    font-family: "Space Mono", "Courier New", monospace;
    font-size: 0.72rem;
    color: var(--ink-soft);
  }
  footer .heart { color: var(--pink); }
</style>
</head>
<body>

    <span class="badge">✦ welcome to my corner of the web ✦</span>

    <h1>Hello World!!<span class="blink">_</span></h1>

    <p class="intro">
      My <span class="accent">"name"</span> is Fauxvale (she/her) and I like
      computers and video and being silly and having fun.
    </p>

    </div>

    <h2 class="section-title">Subpages</h2>
    <div class="subpages">
      <a class="subpage-link" href="https://fauxvale.github.io/skyrimnet-save-explorer.html" target="_blank" rel="noopener noreferrer">
        Fauxvale's SkyrimNet Save Observer <span class="arrow">→</span>

    </div>

    <footer>made with <span class="heart">♥</span> by Fauxvale</footer>
  </main>
</body>
</html>
