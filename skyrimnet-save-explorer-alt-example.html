["Bandit Outlaw", 1], ["Bandit Chief", 1], ["Thief", 1], ["Bear", 1]]}, {"killer": "Wolf", "total": 4, "cats": {"Wildlife": 4}, "victims": [["Rabbit", 2], ["Fox", 1], ["Elk", 1]]}, {"killer": "Mirmulnir", "total": 2, "cats": {"People": 2}, "victims": [["Whiterun Guard", 2]]}, {"killer": "Bandit Outlaw", "total": 1, "cats": {"Wildlife": 1}, "victims": [["Elk", 1]]}, {"killer": "Vigilant of Stendarr", "total": 1, "cats": {"Wildlife": 1}, "victims": [["Wolf", 1]]}], "diary": [{"actor": "Jules", "loc": "Near The Ritual Stone, The Ritual Doomstone, Outdoors, Hold: Whiterun", "content": "Another day threaded with blood and strange omens. I write this by the dim glow of my *Candlelight* spell, the Ritual Stone looming like a rotten tooth in the gray afternoon. My arms still hum from the greatsword’s weight — not just from the wolf at White River Watch, but from the weight of what’s pressing in.\n\nThat fight was clean, at least. Lydia’s voice cutting through the snarls: *“Jules, right flank!”* — and me pivoting, steel meeting fang, the wet crunch of bone under frost-tempered iron. I felt the impact shiver up my arms, the heat of exertion blooming beneath my armor. Faendal’s arrow took the second beast before it even broke cover. Efficient. Necessary. But it’s the madwoman’s words that cling like burrs, not the wolf’s blood.\n\nShe spoke of a master lost, of Dervenin, of Solitude. Said my armor wouldn’t help me find him. As if she saw through me — through the steel and spells, straight to the girl from the Heartland chasing a grandmother’s dream. I offered to look, of course. What else does a bard’s heir do but listen to stories, even the fractured ones?\n\nAnd the Jarl’s summons — Mirmulnir, the soul tearing into me like a winter gale, the Word on my tongue before I knew I spoke it. *Dragonborn.* Still feels like a borrowed title, too large for my shoulders. Yet the gold from Farengar for the bile and rheum is real enough — 400 septims clinking in my belt pouch, 282 spent on *Healing* and *Candlelight*. Practical magic, the kind Nana would’ve scoffed at. She sang wounds closed, not cast them. Farengar suggested Winterhold. I almost laughed. Me? Among the robe-swirlers and scrying pools? But the thought lingers. Magic is power, and power keeps me alive between here and Solitude.\n\nFaendal watches the trees, bow loose in his hands. Lydia stands like a statue, scanning the ridgeline. They’ve both seen me fight, seen the dragon’s soul burn in my eyes. Do they see a warrior? A curiosity? Or just another blade for hire? I killed Nazeem’s words with steel this morning — a petty thing, perhaps, but satisfying. Still, it’s the madwoman’s warning that echoes: *Don’t go to the Blue Palace. Don’t listen to Dervenin.*\n\nI’ll go to Solitude. I’ll find the Bard’s College. And if Dervenin stands in the way, or the Blue Palace hides traps, then let them come. Nana’s songs are in my blood, and now, something older. I’ll sing my way through if I must — or shout a Word that tears the sky.", "emotion": "reflective"}, {"actor": "Jules", "loc": "Ivarstead (Waterside), Hold: The Rift, Outdoors", "content": "Slept like the dead last night, and Mara bless it, I needed that. Told Lydia this morning I felt like I could've slept through a dragon crashing through the roof — she just grunted something about earned rest and told me to eat my bread. Fair enough. After the Seven Thousand Steps down from High Hrothgar, my legs had opinions about ever climbing anything again.\n\nIvarstead in the morning light is a sleepy little thing. Bought stew and a couple of travel packs off Wilhelm before we left the inn — 196 gold, which stings a bit less now that Farengar's coin is still padding my purse. Overheard the guard outside grumbling about wanting his furs, and Barknar warning some poor soul about wolves on the mountain path while Temba complained louder about bears wrecking her timber stock. Small-town troubles. Almost quaint, after everything.\n\nBut it was the guard's other words that snagged me — *the Greybeards have summoned the Dragonborn to High Hrothgar, hasn't happened in hundreds of years.* Said so plainly, like weather. Like I wasn't standing three feet away with the Horn of Jurgen Windcaller sitting unclaimed somewhere in Ustengrav, waiting on me to go dig it out of whatever's guarding it. Strange, hearing your own myth spoken aloud by a stranger who has no idea you're the punchline.\n\nI keep turning over what happened at High Hrothgar, honestly — feels like it hasn't finished settling in me yet. Borri teaching me *Wuld*, the Word of Whirlwind, and it just... clicking, like a verse I already knew the tune to. Arngeir's face when I mastered it so fast — that mix of astonishment and worry he tries to keep off his face and mostly fails at. He's not subtle, for a man who's spent decades cultivating silence. And then the warning, him and Wulfgar murmuring together like they didn't want me to hear, about what might be waiting in that tomb. I heard enough. Enough to know it isn't nothing.\n\nLydia reaffirmed she's coming with me regardless — didn't even hesitate when I brought up maybe splitting the risk. Just gave me that flat, unimpressed housecarl look, the one that says *don't insult me by suggesting it again.* I won't lie, there's a comfort in that steadiness. Nana used to say a bard is only as good as the people who'll stand at the edge of the firelight while she sings — meaning, I think, that stories need witnesses, need someone keeping watch so the teller can lose herself in the telling. Lydia's that, in her own way. Faendal too, when he's near, though he's drifted looser these past days, more habit than oath.\n\nWalking down through Ivarstead's cobbled bridge this morning, the leaves doing that gorgeous burnt-orange thing they do this time of year, I let myself just... breathe for a minute. Didn't think about Ustengrav, or the horn, or Dragonborn, or war. Just the sound of water under stone and Lydia's boots on the path beside me. Small mercies. The kind Nana would've called a verse worth remembering even if it never makes it into the song.\n\nBecause the song's coming, isn't it. Ulfric's declared war on the Thalmor now — actual war, not just growling across a table. Word reached even sleepy little Ivarstead: clashes near Kynesgrove, routing at Windhelm's gates. The whole east side of Skyrim is a tinderbox and I keep threading through it like I've got all the time in the world, chasing horns and Words of Power while armies gather. There's a tension in that I try not to look at too directly — like a wound you know is there but don't want to prod. Best to keep moving, keep the road ahead sharper in my mind than the road behind.\n\nStill mulling on the madwoman's warning too, if I'm honest — Dervenin, the Blue Palace, all that. Haven't forgotten it, just... shelved it, the way you shelve a story you're not ready to tell yet. Solitude's still out there, still waiting, still holding the Bard's College and whatever answers that woman was pointing me toward. But Ustengrav comes first. Arngeir was clear enough about that, and much as I chafe sometimes at being *directed*, I understand the shape of it — prove myself with the horn, then maybe the rest of the path opens up.\n\nWe're pressing out from Ivarstead again shortly, back toward the mountain road and whatever waits past it. My arms have mostly stopped aching from that wolf fight at White River Watch, though my mind hasn't quite let go of Mirmulnir's soul tearing into me, or the weight of that first true Shout. Two Words mastered now — *Fus Ro* and *Wuld* — and each one feels less like something I learned and more like something I *remembered*, which is a stranger thought than I like sitting with for too long.\n\nFor now, though: stew in my belly, boots on solid ground, Lydia at my shoulder scanning the treeline like she always does. Ustengrav waits. Whatever's guarding that horn, I'll meet it with steel in hand and a Word ready on my tongue if it comes to that. Nana always said the best stories have teeth. Guess I'm about to find out if mine do too.", "emotion": "content"}, {"actor": "Lydia", "loc": "Ivarstead (Waterside), Hold: The Rift, Outdoors", "content": "Morning in Ivarstead, and my legs have finally stopped aching from that mountain. Small mercies. I'm sitting near the water listening to it run under the bridge, waiting on Jules to finish whatever business she's got with the guards, and I find myself wanting to put down what's happened these past few days before it all blurs together the way hard marches tend to do.\n\nHigh Hrothgar. Gods, I still feel the cold of that place in my knees. I stood in that courtyard and watched Jules — my Thane, a woman I was still half-sizing up not two moons past — pull the Voice itself out of the air like she was born to it. Fus Ro, clean as a blade strike, and the Greybeards nodding like she'd passed some test they didn't expect her to pass so quick. Then Wuld, and she was just *gone*, a blur across the stones and back again before I'd finished blinking. I've fought beside shieldmaidens who trained their whole lives for half that grace. It isn't training. It's something else entirely, and I won't pretend it doesn't put a chill in me that has nothing to do with mountain air.\n\nAnd then they gave her the real task. Not words this time — an object. A horn, sitting in some tomb called Ustengrav, guarded by however many centuries of Nord dead don't take kindly to visitors. I told Wulfgar I'd stand at her back no matter what waited in that tomb, and I meant every word of it. That's the oath. That's what I'm for. But I won't lie in my own diary — barrows unsettle me more than bandits ever have. Steel and flesh I understand. Whatever's been rotting in a tomb for four thousand years answering back when you open the door, that's a different fight, and not one shield and sword always answer for.\n\nFaendal left us there. Dismissed, and off to Riverwood without much ceremony. Can't say I'll miss the constant Bosmer commentary on everything from wolves to the afterlife, but he pulled his weight when it mattered — coordinated fire is coordinated fire, elf or no. Just Jules and me now, which suits me fine. Fewer voices to manage, and I trust my own read of a fight better than trying to guess what a hunter three paces back is planning.\n\nComing down off the mountain we ran into a troll near dusk two nights back — ugly, fast, regenerates faster than you can carve into it. Jules staggered it with the Voice before it got its claws into either of us, Faendal put an arrow through its neck, and I finished the job with the axe. Good work, all three of us moving like we'd drilled it. Then bears at Pinepeak Cavern — two of the damn things, one right at the mouth of the cave and another waiting inside like it knew we were coming. Bears are worse than trolls in some ways, meaner up close, and that cave stank of old blood and worse before we even cleared it. We came out the other side with a book on armor forging, which Jules seemed pleased about, and not a scratch between us. I'll take that trade every time.\n\nSlept properly last night for the first time in what feels like a week — actual furs, actual roof, actual quiet but for Bassianus complaining at everyone who so much as looked at him. Woke to the whole town chattering about wolves and bears and some haunted barrow east of here that old Wilhelm won't shut up about warning travelers off. Temba's more worried about her timber than any of it, which tells you something about how folk here rank their troubles. I told the guard outside I wouldn't mind a proper bed myself before we climb again — and gods, I meant it. My feet have earned a rest more than most days I can remember, between the road from Darkwater and that mountain path.\n\nSo here's where I've landed on all this, turning it over: I came into this service half-expecting routine guard duty with occasional excitement, the kind of thing housecarls usually get. Instead I've got a Thane who shouts mountains awake and outruns arrows, and a tomb full of the restless dead waiting on the other side of whatever road we take next. That should worry me more than it does. Instead there's something almost steadying about it — she thanked me on the road after that thief went for her, didn't need to, but she did, and it's little things like that which tell me this isn't a burden I'm carrying alone. Whatever's in Ustengrav, we'll go in together. That's the job. That's the oath. I'll sharpen the axe tonight and stop worrying at what I can't yet see.", "emotion": "reflective"}], "screenshots": [{"name": "BleakFallsTower", "loc": "BleakFallsTower · BleakFallsTower", "ts": "8:55 AM, Tirdas, 19th of Last Seed, 4E 201", "desc": "The interior features rough-hewn stone walls constructed from large, irregular blocks, showing signs of age and structural wear with visible cracks and uneven mortar. A simple wooden chair with a slatted back and seat rests against the wall, its surface weathered and stained. The floor is made of worn wooden planks, some splintered or broken, and bears dark stains consistent with old blood. A body lies partially on the floor near the chair, clad in tattered clothing and armor, suggesting a violent encounter occurred here.\n\nA tall, ornate wooden post with carved Nordic knotwork and metal reinforcements stands near the right edge of the frame, possibly serving as a structural support or ceremonial fixture. The space is cramped and dimly lit, with no visible windows or natural light sources, reinforcing its subterranean or enclosed nature. The overall atmosphere is grim and abandoned, with no signs of recent habitation or maintenance.\n\nThis appears to be a small, fortified chamber within a larger ruin or tower, likely used for storage, guard duty, or as a makeshift resting area. The combination of sturdy stonework, Nordic decorative elements, and signs of past violence aligns with the architecture and history of ancient Nordic strongholds found throughout Skyrim’s mountainous regions. The presence of the body and bloodstains indicates it was recently the site of conflict, consistent with the frequent dangers encountered in such isolated, ruinous structures."}, {"name": "Riverwood01", "loc": "Riverwood01 · Riverwood01", "ts": "9:49 AM, Tirdas, 19th of Last Seed, 4E 201", "desc": "A dense forest clearing frames a rustic village nestled against a backdrop of mist-shrouded mountains. Towering evergreens with moss-covered trunks dominate the foreground, their branches heavy with needles, while clusters of wild mushrooms cling to the bark. The ground is carpeted in low-lying ferns and clover, interspersed with patches of damp earth and scattered stones. Beyond the trees, simple wooden structures with thatched roofs and stone foundations rise gently on a sloping hillside, connected by rough-hewn wooden stairs and pathways.\n\nThis settlement functions as a modest frontier village, its architecture reflecting practical Nordic design—sturdy, functional, and built to withstand the region’s harsh climate. Stone retaining walls and wooden railings reinforce the terrain’s natural incline, suggesting adaptation to the hilly landscape. The presence of multiple dwellings and a central stairway indicates a communal living space, likely serving as a waystation for travelers or a hub for local trade. In the distance, the silhouette of a lone pine tree stands against the fog, reinforcing the remote, mountainous setting.\n\nWhat distinguishes this location is the seamless integration of natural and built environments—the village appears to grow organically from the forested hillside, with structures nestled between ancient trees rather than clearing them away. The mossy tree trunks and persistent mist lend a damp, verdant atmosphere, while the visible stonework and timber framing echo the utilitarian aesthetic of Skyrim’s rural settlements. The composition of the scene, viewed from behind a massive tree trunk, emphasizes its immersive, lived-in quality, positioning the viewer as an observer stepping into a quiet, enduring corner of the northern wilderness."}, {"name": "RiverwoodPath", "loc": "RiverwoodPath · RiverwoodPath", "ts": "6:55 AM, Middas, 20th of Last Seed, 4E 201", "desc": "A narrow dirt trail cuts through a rugged, mountainous terrain, flanked on both sides by large, weathered gray boulders and outcroppings. The ground is uneven, covered in loose soil, scattered pebbles, and exposed tree roots, suggesting frequent foot traffic through a natural pass. Sparse patches of green ferns and low shrubs cling to the slope, breaking the monotony of earth and stone. Towering evergreen trees rise in the midground, their dark green foliage contrasting with the pale, mist-shrouded peaks visible in the distance.\n\nThis is a wilderness trail, likely serving as a connector between settlements or natural landmarks. The terrain suggests it is part of a larger mountainous region, possibly near a river valley given the moisture-laden air and vegetation. No permanent structures or man-made markers are visible, reinforcing its role as a natural thoroughfare. The scale of the boulders and the density of the forest imply this path traverses a remote, untamed area, typical of Skyrim’s highland regions where trails are carved by necessity rather than design.\n\nWhat distinguishes this path is its raw, unrefined character — the absence of paving, railings, or signage, and the dominance of natural rock formations shaping the route. The juxtaposition of the dark, damp earth against the pale, foggy mountains in the background creates a sense of isolation and elevation. The trail’s winding, constrained nature, hemmed in by boulders and trees, makes it visually distinct from open plains or forest clearings, marking it as a passage through a narrow, elevated corridor of the wild."}, {"name": "SnowFX", "loc": "SnowFX · SnowFX", "ts": "7:20 AM, Middas, 20th of Last Seed, 4E 201", "desc": "A snow-covered mountain slope rises steeply from a narrow, winding path, its surface a mix of packed snow and exposed dark stone. Evergreen trees, heavily laden with snow, stand clustered along the trail’s edge, their branches drooping under the weight. Sparse, leafless shrubs dot the lower ground, their twigs dusted white. In the distance, a dense coniferous forest stretches across the valley floor, backed by jagged, snow-capped peaks that fade into a pale, overcast sky.\n\nBeyond the treeline, the weathered stone ruins of a tower or keep perch atop a distant ridge, its crumbling walls and broken battlements suggesting long abandonment. The terrain is rugged and uneven, with boulders and rocky outcrops breaking through the snow cover. The overall color palette is muted—grays, whites, and dull greens dominate, reinforcing the harsh, cold climate typical of Skyrim’s highlands. No structures or signs of recent habitation are visible along the immediate path.\n\nThis area exemplifies the untamed wilderness of Skyrim’s northern reaches, where natural terrain and ancient ruins coexist. The combination of snow-laden pines, exposed rock, and distant ruins creates a visually distinct environment often encountered along high-altitude trails. Its isolation and ruggedness suggest it serves as a natural corridor between settlements or as a forgotten outpost, consistent with the game’s themes of exploration and decay."}, {"name": "BleakfallsBarrowPath", "loc": "BleakfallsBarrowPath · BleakfallsBarrowPath", "ts": "7:25 AM, Middas, 20th of Last Seed, 4E 201", "desc": "A snow-covered mountain trail winds through a rugged, rocky landscape dominated by jagged stone outcroppings and scattered evergreen trees dusted with snow. The ground is uneven, composed of packed earth and exposed bedrock, partially blanketed by a thin layer of snow. A prominent cairn of stacked flat stones stands beside the path, serving as a trail marker. Sparse, lea (function(){
 const s = section('sn-constel',2,'Constellation of Memory',
   'Every memory as a star &mdash; size by importance, colour by mind. Faint lines join the two nearest memories in the full 384-dimensional space. '+
   '<span id="projcap"></span>');
 const top = el('div','constel-top');
 const chips = el('div','chips'); chips.id='constel-actors';
 const mkChip=(label,val)=>{ const b=el('button','chip'+(val===constelState.actor?' on':''),esc(label)); b.dataset.actor=val;
   if(val!=='All'&&val!=='__other__'){ b.style.borderColor='transparent'; }
   b.onclick=()=>{ constelState.actor=val; syncActor(); }; return b; };
 chips.appendChild(mkChip('All','All'));
 topActors.forEach(a=>{ const c=mkChip(a,a); const dot=el('span'); dot.style.cssText='display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle;background:'+colorFor(a); c.prepend(dot); chips.appendChild(c); });
 chips.appendChild(mkChip('Everyone else','__other__'));
 const toggle = el('div','projtoggle');
 const bu=el('button',null,'UMAP'), bp=el('button',null,'PCA'); bu.classList.add('on');
 toggle.appendChild(bu); toggle.appendChild(bp);
 top.appendChild(chips); top.appendChild(toggle);
 s.appendChild(top);
 const wrap=el('div','constel-wrap');
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'); svg.id='constel'; svg.setAttribute('viewBox','0 0 1000 560');
 const tip=el('div','startip');
 wrap.appendChild(svg); wrap.appendChild(tip); s.appendChild(wrap);
 paneSN.appendChild(s); snTOC.push(['sn-constel',2,'Constellation']);

 const W=1000,H=560,PAD=46;
 const nodes = SN.memories.map((m,i)=>({i,m,x:0,y:0,hx:0,hy:0,vx:0,vy:0}));
 function layout(){
   const px = constelState.proj==='umap'?'ux':'uy'; // placeholder
   nodes.forEach(n=>{
     const cx = constelState.proj==='umap'? n.m.ux : n.m.x;
     const cy = constelState.proj==='umap'? n.m.uy : n.m.y;
     n.hx = PAD + cx*(W-2*PAD); n.hy = PAD + (1-cy)*(H-2*PAD);
     n.x = n.hx; n.y = n.hy; n.vx=0; n.vy=0;
   });
   document.getElementById('projcap').innerHTML = constelState.proj==='umap'
     ? 'Showing <b>UMAP</b> (cosine metric) &mdash; neighbourhoods match the recall the mod actually uses.'
     : 'Showing <b>PCA</b> &mdash; a linear shadow capturing only <b>'+(SN.pca_var*100).toFixed(1)+'%</b> of variance; long lines are neighbours the projection tore apart.';
 }
 let edgeEls=[], nodeEls=[];
 function draw(){
   while(svg.firstChild) svg.removeChild(svg.firstChild);
   edgeEls=[]; nodeEls=[];
   const gE=document.createElementNS('http://www.w3.org/2000/svg','g');
   SN.edges.forEach(([a,b,sim])=>{ const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
     ln.setAttribute('class','edge'); ln.style.opacity=Math.max(.05,(sim-0.7)*1.1); gE.appendChild(ln); edgeEls.push([ln,a,b]); });
   svg.appendChild(gE);
   const gN=document.createElementNS('http://www.w3.org/2000/svg','g');
   nodes.forEach(n=>{ const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
     const r=3.2+ (n.m.imp-0.5)*16; c.setAttribute('r',Math.max(2.6,r));
     c.setAttribute('fill',colorFor(n.m.actor)); c.setAttribute('fill-opacity','.9');
     c.dataset.i=n.i; gN.appendChild(c); nodeEls[n.i]=c;
     c.addEventListener('pointerenter',e=>showTip(e,n)); c.addEventListener('pointermove',e=>moveTip(e));
     c.addEventListener('pointerleave',hideTip);
     if(!RM) attachDrag(c,n);
   });
   svg.appendChild(gN);
   position();
   syncActor();
 }
 function position(){
   nodeEls.forEach((c,i)=>{ if(!c)return; c.setAttribute('cx',nodes[i].x); c.setAttribute('cy',nodes[i].y); });
   edgeEls.forEach(([ln,a,b])=>{ ln.setAttribute('x1',nodes[a].x);ln.setAttribute('y1',nodes[a].y);ln.setAttribute('x2',nodes[b].x);ln.setAttribute('y2',nodes[b].y); });
 }
 /* spring sim */
 const KH=0.02, KE=0.06, DAMP=0.82; let raf=null, dragging=null;
 const nbr={}; SN.edges.forEach(([a,b,s])=>{ (nbr[a]=nbr[a]||[]).push([b,s]); (nbr[b]=nbr[b]||[]).push([a,s]); });
 function step(){
   let moving=false;
   nodes.forEach(n=>{ if(n===dragging) return;
     let fx=(n.hx-n.x)*KH, fy=(n.hy-n.y)*KH;
     (nbr[n.i]||[]).forEach(([j,s])=>{ fx+=(nodes[j].x-n.x)*KE*s*0.15; fy+=(nodes[j].y-n.y)*KE*s*0.15; });
     n.vx=(n.vx+fx)*DAMP; n.vy=(n.vy+fy)*DAMP; n.x+=n.vx; n.y+=n.vy;
     if(Math.abs(n.vx)+Math.abs(n.vy)>0.03) moving=true;
   });
   position();
   if(moving||dragging){ raf=requestAnimationFrame(step); } else { raf=null; }
 }
 function kick(){ if(RM) return; if(!raf) raf=requestAnimationFrame(step); }
 function attachDrag(c,n){
   c.addEventListener('pointerdown',e=>{ e.preventDefault(); dragging=n; c.setPointerCapture(e.pointerId); c.style.cursor='grabbing';
     const move=ev=>{ const pt=svgPt(ev); n.x=pt.x; n.y=pt.y; position(); };
     const up=ev=>{ dragging=null; c.style.cursor='grab'; c.releasePointerCapture(e.pointerId);
       svg.removeEventListener('pointermove',move); svg.removeEventListener('pointerup',up); kick(); };
     svg.addEventListener('pointermove',move); svg.addEventListener('pointerup',up); kick();
   });
 }
 function svgPt(e){ const r=svg.getBoundingClientRect(); return { x:(e.clientX-r.left)/r.width*W, y:(e.clientY-r.top)/r.height*H }; }
 function showTip(e,n){ tip.innerHTML='<div class="who">'+esc(n.m.actor)+'</div>'+esc(n.m.content)+
   '<div class="meta">'+esc(n.m.type)+(n.m.emotion?' &middot; '+esc(n.m.emotion):'')+' &middot; imp '+n.m.imp.toFixed(2)+
   (n.m.location?'<br>'+esc(n.m.location):'')+'</div>'; tip.style.opacity='1'; moveTip(e); }
 function moveTip(e){ const wrapR=wrap.getBoundingClientRect(); let x=e.clientX-wrapR.left+16, y=e.clientY-wrapR.top+16;
   if(x+330>wrapR.width) x=e.clientX-wrapR.left-330; tip.style.left=x+'px'; tip.style.top=y+'px'; }
 function hideTip(){ tip.style.opacity='0'; }
 function syncActor(){
   document.querySelectorAll('#constel-actors .chip').forEach(c=>c.classList.toggle('on',c.dataset.actor===constelState.actor));
   nodes.forEach(n=>{ let show=true; const a=constelState.actor;
     if(a==='All') show=true; else if(a==='__other__') show=!topActors.includes(n.m.actor); else show=n.m.actor===a;
     if(nodeEls[n.i]) nodeEls[n.i].classList.toggle('dim',!show); });
   if(window.memApplyActor) window.memApplyActor();
 }
 bu.onclick=()=>{ constelState.proj='umap'; bu.classList.add('on'); bp.classList.remove('on'); layout(); position(); document.getElementById('projcap').innerHTML=document.getElementById('projcap').innerHTML; layout(); position(); kick(); };
 bp.onclick=()=>{ constelState.proj='pca'; bp.classList.add('on'); bu.classList.remove('on'); layout(); position(); kick(); };
 window.constelSyncActor=syncActor;
 layout(); draw();
})();

   row.appendChild(fa); row.appendChild(barWrap); row.appendChild(fb); s.appendChild(row);
 });
 paneIntel.appendChild(s); intelTOC.push(['in-powers',inum,'The Great Powers']); inum++;
})();
function leadLine(name){ const f=INTEL.factions.find(x=>x.name===name); if(!f)return '';
 const bits=[]; if(f.leaders&&f.leaders.length)bits.push(f.leaders.join(', ')); if(f.hold)bits.push('seat: '+f.hold);
 return bits.length?'<div class="lead">'+esc(bits.join('  ·  '))+'</div>':''; }

/* --- II & III. War + Battles (conditional) --- */
if(hasWar){
 (function(){
   const w=INTEL.war;
   const s=section('in-war',inum,'The War','');
   const intro=el('div','warintro');
   intro.innerHTML=(w.declared_by?'<b>'+esc(w.declared_by)+'</b> declared war. ':'')+
     '<b>'+w.battles_fought+'</b> battle'+(w.battles_fought===1?'':'s')+' fought so far. '+
     (w.victor?'Victor: <b>'+esc(w.victor)+'</b>.':'No side has yet prevailed.');
   s.appendChild(intro);
   const vs=el('div','versus');
   vs.appendChild(belligerent(w.a,w.a_leaders,w.a_morale,w.a_strength));
   vs.appendChild(el('div','vs','Versus'));
   vs.appendChild(belligerent(w.b,w.b_leaders,w.b_morale,w.b_strength));
   s.appendChild(vs);
   paneIntel.appendChild(s); intelTOC.push(['in-war',inum,'The War']); inum++;
 })();
 (function(){
   if(!INTEL.battles||!INTEL.battles.length) return;
   const s=section('in-battles',inum,'Battles','Where the war has been fought, and at what cost.');
   INTEL.battles.forEach(b=>{ const d=el('div','battle');
     const res=esc(b.result||'').replace(/_/g,' ');
     d.innerHTML='<div class="bh"><span class="bloc">'+esc(b.loc)+'</span>'+
       '<span class="bvs">'+esc(b.attacker)+' attacking '+esc(b.defender)+'</span>'+
       (res?'<span class="bres">'+res+'</span>':'')+'</div>'+
       (b.narrative?'<div class="bnar">'+esc(b.narrative)+'</div>':'')+
       '<div class="bloss"><span>'+esc(b.attacker)+' losses <b>'+b.att_losses+'</b></span>'+
       '<span>'+esc(b.defender)+' losses <b>'+b.def_losses+'</b></span></div>';
     s.appendChild(d); });
   paneIntel.appendChild(s); intelTOC.push(['in-battles',inum,'Battles']); inum++;
 })();
}
function belligerent(name,leaders,morale,strength){
 const d=el('div','belligerent');
 d.innerHTML='<div class="bn">'+esc(name)+'</div><div class="bl">'+esc((leaders||[]).join(', '))+'</div>'+
   gauge('Morale',morale,'var(--gold)')+gauge('Strength',strength,'var(--thoughts)');
 return d;
}
function gauge(label,val,color){
 return '<div class="gauge"><div class="gl"><span>'+label+'</span><b>'+val+'</b></div><div class="gbar"><i style="width:'+val+'%;background:'+color+'"></i></div></div>';
}

/* --- Chronicle of Provocations --- */
(function(){
 const s=section('in-provocations',inum,'Chronicle of Provocations','Every incident that moved the needle, in the order it happened.');
 INTEL.events.forEach(e=>{ const d=el('div','prov');
   d.innerHTML='<div class="ptag">'+esc((e.type||'').replace(/_/g,' '))+'</div>'+
     '<div><div class="pdesc">'+esc(e.desc)+'</div><div class="ppair">'+esc(e.a)+'  &rarr;  '+esc(e.b)+'</div></div>'+
     '<div class="pdelta '+(e.delta<0?'neg':'pos')+'">'+(e.delta>0?'+':'')+e.delta+'</div>';
   s.appendChild(d); });
 paneIntel.appendChild(s); intelTOC.push(['in-provocations',inum,'Provocations']); inum++;
})();

/* --- Whispers --- */
(function(){
 const s=section('in-whispers',inum,'Whispers Beyond the Road','');
 if(!GOSSIP.length){
   s.querySelector('.sechead').insertAdjacentHTML('beforeend','<div class="caption">No log was uploaded, so the whisper network could not be reconstructed.</div>');
   paneIntel.appendChild(s); intelTOC.push(['in-whispers',inum,'Whispers']); inum++; return;
 }
 // classifier terms
 const playerTerms=[SN.player.toLowerCase(),'dragonborn','stranger','traveler','traveller'];
 const factionTerms=[]; INTEL.factions.forEach(f=>{ factionTerms.push(f.name.toLowerCase());
   (f.leaders||[]).forEach(l=>factionTerms.push(l.toLowerCase())); if(f.hold)factionTerms.push(f.hold.toLowerCase()); });
 factionTerms.push('thalmor','stormcloak','imperial','legion','war','tariff','justiciar','ulfric','tullius','elenwen');
 function classify(r){ const t=(r||'').toLowerCase();
   if(playerTerms.some(p=>p&&t.includes(p))) return 'player';
   if(factionTerms.some(p=>p&&t.includes(p))) return 'political';
   return 'personal'; }
 const items=GOSSIP.map(g=>({...g,cls:classify(g.rumor)}));
 const counts={player:0,political:0,personal:0}; items.forEach(i=>counts[i.cls]++);
 const voices=new Set(); items.forEach(i=>{voices.add(i.speaker);voices.add(i.listener);});
 // summary stats
 const stat=el('div','statrow'); stat.style.margin='6px auto 20px'; stat.style.justifyContent='flex-start';
 [[items.length,'Whispers'],[voices.size,'Voices'],[counts.political,'Political'],[counts.player,'About '+SN.player]]
   .forEach(([n,l])=>{ const d=el('div','stat'); d.innerHTML='<div class="num">'+n+'</div><div class="lbl">'+esc(l)+'</div>'; stat.appendChild(d); });
 s.appendChild(stat);
 const state={f:'all'};
 const chips=el('div','chips');
 const mk=(label,val,cnt)=>{ const b=el('button','chip'+(val===state.f?' on':''),esc(label)+'<span class="c">'+cnt+'</span>'); b.onclick=()=>{state.f=val;render();}; b.dataset.f=val; return b; };
 chips.appendChild(mk('All','all',items.length));
 chips.appendChild(mk('About '+SN.player,'player',counts.player));
 chips.appendChild(mk('Political','political',counts.political));
 chips.appendChild(mk('Personal','personal',counts.personal));
 s.appendChild(chips);
 const holder=el('div'); s.appendChild(holder);
 function render(){
   document.querySelectorAll('#in-whispers .chip[data-f]').forEach(c=>c.classList.toggle('on',c.dataset.f===state.f));
   holder.innerHTML='';
   items.filter(i=>state.f==='all'||i.cls===state.f).forEach(i=>{ const d=el('div','whisper');
     d.innerHTML='<div class="wline"><span class="sp">'+esc(i.speaker)+'</span><span class="ar">&rarr;</span><span class="ls">'+esc(i.listener)+'</span>'+
       '<span class="wtags"><span class="wtag '+i.cls+'">'+i.cls+'</span></span></div>'+
       '<div class="rumor">&ldquo;'+esc(i.rumor)+'&rdquo;</div>'+(i.scene?'<div class="scene">'+esc(i.scene)+'</div>':'');
     holder.appendChild(d); });
 }
 render();
 paneIntel.appendChild(s); intelTOC.push(['in-whispers',inum,'Whispers']); inum++;
})();

/* ================= TOC + TABS ================= */
function buildTOC(list){
 const box=document.getElementById('toclist'); box.innerHTML='';
 list.forEach(([id,num,label])=>{ const a=el('a',null,'<span class="rn">'+ROMAN[num]+'</span>'+esc(label)); a.href='#'+id; a.dataset.id=id; box.appendChild(a); });
}
let activeTab='sn';
function setTab(t){
 activeTab=t;
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
 document.getElementById('pane-sn').classList.toggle('active',t==='sn');
 document.getElementById('pane-intel').classList.toggle('active',t==='intel');
 document.getElementById('eyebrow').textContent = t==='sn' ? 'A SkyrimNet Field Journal' : 'An IntelEngine Dispatch';
 buildTOC(t==='sn'?snTOC:intelTOC);
 window.scrollTo({top:0,behavior:RM?'auto':'smooth'});
 setTimeout(spy,50);
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));

/* scroll spy */
function spy(){
 const list=activeTab==='sn'?snTOC:intelTOC;
 let cur=list.length?list[0][0]:null;
 for(const [id] of list){ const s=document.getElementById(id); if(!s)continue;
   if(s.getBoundingClientRect().top<=140) cur=id; }
 document.querySelectorAll('#toclist a').forEach(a=>a.classList.toggle('active',a.dataset.id===cur));
}
window.addEventListener('scroll',()=>{ if(!spy._t)spy._t=setTimeout(()=>{spy._t=null;spy();},80); },{passive:true});
buildTOC(snTOC); spy();

</script>
