:root{
 --void:#0e0f12; --void2:#0a0b0d; --field:rgba(8,9,11,.90);
 --parchment:#cdc7b8; --parch-bright:#e6e0d1; --dim:#8a8578; --faint:#5c584f;
 --gold:#d8b46a; --gold-lit:#f0d38a; --bronze:#6f6552; --bronze-dim:#4a4438;
 --dialogue:#d8b46a; --death:#b0463b; --thoughts:#7ea3b3; --trade:#7b9460; --follower:#8a8578;
 --hair:rgba(205,199,184,.14); --hair2:rgba(205,199,184,.07);
 --panel-slice:39 41 fill;
 --display:'FuturaCond','Oswald','Arial Narrow',sans-serif;
 --body:'Crimson Pro','Iowan Old Style','Palatino Linotype',Georgia,serif;
 --mono:'JetBrains Mono','SFMono-Regular',Consolas,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 margin:0; background:var(--void);
 background-image:radial-gradient(1200px 700px at 50% -10%, #16181d 0%, var(--void) 55%, var(--void2) 100%);
 color:var(--parchment); font-family:var(--body); font-size:18px; line-height:1.62;
 -webkit-font-smoothing:antialiased;
}
img{max-width:100%}
a{color:var(--gold);text-decoration:none}
::selection{background:rgba(216,180,106,.28);color:var(--parch-bright)}

}
.wrap{max-width:1140px;margin:0 auto;padding:0 26px}

/* ---- top tab bar ---- */
.tabbar{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--void) 60%,rgba(14,15,18,.0));
 backdrop-filter:blur(3px);border-bottom:1px solid var(--hair)}
.tabbar .inner{max-width:1140px;margin:0 auto;display:flex;gap:0;align-items:stretch;padding:0 26px}
.tab{appearance:none;background:none;border:none;cursor:pointer;color:var(--dim);
 font-family:var(--display);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
 font-size:15px;padding:18px 26px 15px;position:relative;transition:color .18s ease,transform .18s ease}
.tab:hover{color:var(--parchment)}
.tab.active{color:var(--gold)}
.tab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:0;height:2px;
 background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tab .arrow{opacity:0;position:absolute;left:-2px;top:50%;transform:translateY(-50%);color:var(--gold);font-size:11px;transition:opacity .18s}
.tab.active .arrow{opacity:1}

/* ---- header ---- */
header.hero{position:relative;text-align:center;padding:74px 0 30px;overflow:hidden}
.hero .dragon{position:absolute;left:50%;top:24px;transform:translateX(-50%);width:340px;
 opacity:.06;filter:brightness(1.6);pointer-events:none;user-select:none}
.eyebrow{font-family:var(--display);font-weight:500;letter-spacing:.42em;text-transform:uppercase;
 color:var(--gold);font-size:12.5px;margin:0 0 14px;position:relative}
.charname{font-family:var(--display);font-weight:300;letter-spacing:.14em;text-transform:uppercase;
 font-size:clamp(46px,9vw,92px);line-height:.98;margin:0;color:var(--parch-bright);
 text-shadow:0 2px 30px rgba(216,180,106,.14)}
.subtitle{font-family:var(--body);font-style:italic;color:var(--dim);font-size:19px;margin:16px auto 0;max-width:680px}
.statrow{display:flex;flex-wrap:wrap;justify-content:center;gap:0;margin:36px auto 8px;max-width:900px}
.stat{padding:6px 30px;position:relative;min-width:120px}
.stat + .stat::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:1px;background:var(--hair)}
.stat .num{font-family:var(--mono);font-weight:500;font-size:30px;color:var(--gold);line-height:1}
.stat .lbl{font-family:var(--display);font-weight:500;letter-spacing:.18em;text-transform:uppercase;
 font-size:11px;color:var(--dim);margin-top:9px}

/* ---- double-rule + section headers ---- */
.doublerule{height:0;border-top:1px solid var(--bronze-dim);border-bottom:1px solid var(--hair2);
 margin:0;max-width:1140px;margin-left:auto;margin-right:auto}
.knot{height:26px;margin:30px auto 8px;background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA+gAAAAGCAYAAABQBbSLAAAAqElEQVR42u3bsW2EUBBF0ZlvQAQuwaW4UVpwG05dymZexBcCxolrYJNzSrjZ02hyWZbvaZo+932/IqIFAAAAcIuqOud5fuu9f7WIeEoCAAAAr9Wq6pmZUVUlBwAAALzGkJm/mXll5hURKQkAAADc43+PZ2vtMUTExziO7TiO1poXdAAAALjLdV1tmqbovb8PEdHXdf05z7My0wUdAAAAbtzo27a1qjr+AOa9Nf0okhb5AAAAAElFTkSuQmCC) center/auto 100% no-repeat;opacity:.6}
section{padding:52px 0 8px;scroll-margin-top:70px}
.sechead{display:flex;align-items:baseline;gap:18px;margin:0 0 8px}
.sechead .rn{font-family:var(--mono);color:var(--gold);font-size:14px;font-weight:500;letter-spacing:.1em;flex:0 0 auto}
.sechead h2{font-family:var(--display);font-weight:500;letter-spacing:.2em;text-transform:uppercase;
 font-size:clamp(20px,3vw,27px);margin:0;color:var(--parch-bright);flex:0 0 auto}
.sechead .tail{flex:1 1 auto;height:1px;background:linear-gradient(90deg,var(--bronze-dim),transparent);align-self:center;margin-left:6px}
.sechead .caption{flex-basis:100%;font-style:italic;color:var(--dim);font-size:16px;margin-top:6px}
.sublabel{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--dim)}

/* ---- floating TOC ---- */
#toc{position:fixed;top:96px;left:max(14px,calc(50% - 700px));width:186px;z-index:40;
 font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase}
#toc .toclab{color:var(--gold);font-size:11px;letter-spacing:.3em;margin-bottom:12px;padding-left:16px}
#toc a{display:block;color:var(--dim);padding:6px 6px 6px 16px;position:relative;transition:color .16s;line-height:1.3}
#toc a:hover{color:var(--parchment)}
#toc a.active{color:var(--gold)}
#toc a.active::before{content:"\25B8";position:absolute;left:2px;color:var(--gold)}
#toc .rn{color:var(--faint);font-family:var(--mono);margin-right:7px;font-size:11px}
.toctoggle{display:none}

/* ---- generic cards / chips ---- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{appearance:none;cursor:pointer;font-family:var(--display);letter-spacing:.13em;text-transform:uppercase;
 font-size:11.5px;color:var(--dim);background:rgba(205,199,184,.03);border:1px solid var(--hair);
 padding:7px 13px;transition:all .16s ease;white-space:nowrap}
.chip:hover{color:var(--parchment);border-color:var(--bronze);transform:translateY(-1px)}
.chip.on{color:var(--void);background:var(--gold);border-color:var(--gold);font-weight:500}
.chip .c{font-family:var(--mono);opacity:.7;margin-left:6px;font-size:10.5px}
.chip.on .c{opacity:.85}
.livecount{font-family:var(--mono);font-size:12.5px;color:var(--dim);margin:6px 0 16px}

/* ---- Timeline ---- */
.timeline{display:flex;align-items:flex-end;gap:2.4%;margin:26px 0 12px;min-height:280px;padding:0 4px}
.tlday{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.tlbar{width:100%;max-width:74px;display:flex;flex-direction:column-reverse;border:1px solid var(--hair);
 background:rgba(0,0,0,.25);transition:filter .2s}
.tlbar:hover{filter:brightness(1.18)}
.tlseg{width:100%;transition:height .5s cubic-bezier(.2,.7,.2,1)}
.tlmeta{text-align:center}
.tlmeta .d{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--parchment)}
.tlmeta .t{font-family:var(--mono);font-size:12px;color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:16px;margin:14px 0 6px;justify-content:center}
.legend span{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;display:inline-block;border-radius:2px}

/* ---- Constellation ---- */
.constel-wrap{position:relative;margin:16px 0}
#constel{width:100%;height:560px;background:radial-gradient(700px 460px at 50% 42%,rgba(30,33,40,.5),transparent 70%);
 touch-action:none}
#constel .edge{stroke:var(--gold);stroke-width:.7}
#constel circle{cursor:grab}
#constel circle.dim{opacity:.08!important}
.startip{position:absolute;pointer-events:none;z-index:20;max-width:320px;background:var(--void2);
 border:1px solid var(--bronze);padding:12px 14px;font-size:14.5px;line-height:1.45;opacity:0;transition:opacity .12s;
 box-shadow:0 8px 30px rgba(0,0,0,.6)}
.startip .who{font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--gold);margin-bottom:5px}
.startip .meta{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:7px}
.projtoggle{display:inline-flex;border:1px solid var(--hair);margin-left:auto}
.projtoggle button{appearance:none;background:none;border:none;cursor:pointer;font-family:var(--display);
 letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--dim);padding:7px 15px}
.projtoggle button.on{background:var(--gold);color:var(--void);font-weight:500}
.constel-top{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}

/* ---- Memories list ---- */
.daygroup{margin:22px 0}
.dayhead{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--hair);padding-bottom:8px;margin-bottom:6px}
.dayhead h3{font-family:var(--display);letter-spacing:.16em;text-transform:uppercase;font-size:15px;margin:0;color:var(--parch-bright)}
.dayhead .cnt{font-family:var(--mono);font-size:12px;color:var(--gold)}
.dayhead .sum{font-style:italic;color:var(--dim);font-size:15px;margin-left:auto;text-align:right;max-width:52%}
.mem{display:grid;grid-template-columns:172px 1fr 128px;gap:20px;padding:15px 4px;border-bottom:1px solid var(--hair2);align-items:start}
.mem.hide{display:none}
.mem .who{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
.mem .whotype{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:5px;text-transform:none;letter-spacing:0}
.mem .txt{font-size:16.5px;color:var(--parchment)}
.mem .loc{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:6px}
.mem .imp{text-align:right}
.impbar{height:5px;background:rgba(205,199,184,.08);position:relative;margin-top:6px}
.impbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--bronze),var(--gold))}
.mem .impval{font-family:var(--mono);font-size:11px;color:var(--gold)}

/* ---- Leaderboard ---- */
.lbrow{display:grid;grid-template-columns:40px 190px 1fr;gap:18px;align-items:center;padding:16px 6px;border-bottom:1px solid var(--hair2)}
.lbrank{font-family:var(--mono);font-size:20px;color:var(--faint)}
.lbname{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:17px}
.lbtotal{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:3px}
.lbbar{height:20px;display:flex;border:1px solid var(--hair);background:rgba(0,0,0,.3);overflow:hidden}
.lbbar i{height:100%;transition:width .5s}
.lbvictims{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.vchip{font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--hair2);padding:2px 8px}
.vchip b{color:var(--parchment);font-weight:500}

/* ---- Diary ---- */
.book{position:relative;max-width:720px;margin:22px auto 6px}
.page{background:linear-gradient(180deg,rgba(28,26,22,.72),rgba(20,19,16,.72));
 padding:38px 42px;position:relative;box-shadow:inset 0 0 60px rgba(0,0,0,.4)}
.page.hidden{display:none}
.page .phead{text-align:center;font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--gold);margin-bottom:6px}
.page .ploc{text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:24px}
.page .pbody{font-size:18.5px;line-height:1.72;color:var(--parch-bright)}
.page .pbody p{margin:0 0 15px}
.page .pbody p:first-of-type::first-letter{font-family:var(--display);font-weight:700;float:left;font-size:64px;
 line-height:.8;padding:6px 12px 0 0;color:var(--gold)}
.page em{color:var(--gold-lit);font-style:italic}
.booknav{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:18px}
.booknav button{appearance:none;cursor:pointer;background:none;border:1px solid var(--hair);color:var(--dim);
 font-family:var(--display);letter-spacing:.15em;text-transform:uppercase;font-size:11px;padding:8px 16px;transition:all .16s}
.booknav button:hover:not(:disabled){color:var(--gold);border-color:var(--bronze)}
.booknav button:disabled{opacity:.3;cursor:default}
.booknav .pg{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ---- OmniSight ---- */
.osgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin:20px 0 6px}
.oscard{padding:18px 20px;background:rgba(205,199,184,.02);border:1px solid var(--hair)}
.oscard.hide{display:none}
.oscard .osname{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:14px;color:var(--parch-bright)}
.oscard .osmeta{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:6px 0 12px}
.oscard .osdesc{font-size:15px;color:var(--dim);line-height:1.55}
.showmore{display:block;margin:8px auto 0;appearance:none;cursor:pointer;background:none;border:1px solid var(--hair);
 color:var(--gold);font-family:var(--display);letter-spacing:.18em;text-transform:uppercase;font-size:11px;padding:10px 22px;transition:all .16s}
.showmore:hover{border-color:var(--bronze);color:var(--gold-lit)}

/* ---- Summons & Roads ---- */
.summon{display:grid;grid-template-columns:150px 1fr;gap:20px;padding:16px 6px;border-bottom:1px solid var(--hair2)}
.summon .from{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:14px;color:var(--parch-bright)}
.summon .kind{font-family:var(--mono);font-size:10.5px;color:var(--gold);margin-top:5px;text-transform:uppercase;letter-spacing:.1em}
.summon .scene{font-style:italic;color:var(--dim);font-size:15px;margin-bottom:6px}
.summon .body{font-size:16.5px;color:var(--parchment)}
.summon .dest{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-top:7px}

/* ---- IntelEngine: relations ---- */
.rel{display:grid;grid-template-columns:1fr 300px 1fr;gap:16px;align-items:center;padding:15px 6px;border-bottom:1px solid var(--hair2)}
.rel .fa{text-align:right}.rel .fb{text-align:left}
.rel .fname{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--parch-bright)}
.rel .lead{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px}
.relbar{position:relative;height:26px;background:rgba(0,0,0,.3);border:1px solid var(--hair)}
.relbar .mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--bronze)}
.relbar i{position:absolute;top:0;bottom:0}
.relbar .score{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;z-index:2}
.relbar.war{box-shadow:0 0 0 1px var(--death),0 0 18px rgba(176,70,59,.4)}
.wartag{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:var(--death);
 border:1px solid var(--death);padding:2px 8px;display:inline-block;margin-top:8px}

/* ---- IntelEngine: war ---- */
.warpanel{margin:22px 0 6px;padding:30px 34px}
.warintro{font-style:italic;color:var(--dim);font-size:16.5px;text-align:center;margin:0 auto 26px;max-width:640px}
.warintro b{color:var(--parchment);font-style:normal}
.versus{display:grid;grid-template-columns:1fr 90px 1fr;gap:14px;align-items:center}
.belligerent{text-align:center}
.belligerent .bn{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:22px;color:var(--parch-bright)}
.belligerent .bl{font-family:var(--mono);font-size:11px;color:var(--faint);margin:5px 0 18px}
.gauge{margin:12px 0}
.gauge .gl{display:flex;justify-content:space-between;font-family:var(--display);letter-spacing:.12em;text-transform:uppercase;font-size:10px;color:var(--dim);margin-bottom:5px}
.gauge .gl b{font-family:var(--mono);color:var(--gold)}
.gbar{height:9px;background:rgba(0,0,0,.35);border:1px solid var(--hair)}
.gbar i{display:block;height:100%}
.versus .vs{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:15px;color:var(--death);text-align:center}

/* ---- IntelEngine: battles ---- */
.battle{padding:18px 6px;border-bottom:1px solid var(--hair2)}
.battle .bh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.battle .bloc{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:16px;color:var(--parch-bright)}
.battle .bvs{font-family:var(--mono);font-size:12px;color:var(--dim)}
.battle .bres{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:10px;padding:2px 9px;border:1px solid var(--gold);color:var(--gold)}
.battle .bnar{font-style:italic;color:var(--dim);font-size:15.5px;margin:9px 0 8px}
.battle .bloss{display:flex;gap:26px;font-family:var(--mono);font-size:12px}
.battle .bloss span b{color:var(--death)}

/* ---- IntelEngine: provocations ---- */
.prov{display:grid;grid-template-columns:150px 1fr 60px;gap:16px;align-items:center;padding:14px 6px;border-bottom:1px solid var(--hair2)}
.prov .ptag{font-family:var(--display);letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:var(--gold);border:1px solid var(--hair);padding:5px 8px;text-align:center}
.prov .pdesc{font-size:16px;color:var(--parchment)}
.prov .ppair{font-family:var(--mono);font-size:11px;color:var(--faint);margin-top:5px}
.prov .pdelta{font-family:var(--mono);font-size:15px;text-align:right;font-weight:500}
.pdelta.neg{color:var(--death)}.pdelta.pos{color:var(--trade)}

/* ---- Whispers ---- */
.whisper{display:grid;grid-template-columns:1fr;gap:2px;padding:16px 6px;border-bottom:1px solid var(--hair2)}
.whisper.hide{display:none}
.whisper .wline{font-family:var(--display);letter-spacing:.06em;text-transform:uppercase;font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.whisper .wline .sp{color:var(--parch-bright)}.whisper .wline .ls{color:var(--gold)}
.whisper .wline .ar{color:var(--faint)}
.whisper .wtags{display:flex;gap:6px}
.wtag{font-family:var(--mono);font-size:9.5px;letter-spacing:.05em;padding:1px 7px;border:1px solid var(--hair2);color:var(--faint);text-transform:uppercase}
.wtag.player{color:var(--gold);border-color:rgba(216,180,106,.4)}
.wtag.political{color:var(--thoughts);border-color:rgba(126,163,179,.4)}
.wtag.personal{color:var(--trade);border-color:rgba(123,148,96,.4)}
.whisper .rumor{font-size:17px;color:var(--parchment);margin:8px 0 5px;padding-left:16px;border-left:2px solid var(--bronze-dim)}
.whisper .scene{font-style:italic;color:var(--faint);font-size:14.5px;padding-left:16px}

/* ---- footer ---- */
footer{text-align:center;padding:60px 26px 70px;margin-top:40px;border-top:1px solid var(--hair)}
footer p{font-style:italic;color:var(--faint);font-size:14px;max-width:680px;margin:0 auto;line-height:1.6}
.tabpane{display:none}
.tabpane.active{display:block}

@media (max-width:1120px){#toc{display:none}}
@media (max-width:720px){
 body{font-size:16.5px}
 .mem{grid-template-columns:1fr;gap:8px}
 .mem .imp{text-align:left}
 .rel{grid-template-columns:1fr;gap:8px;text-align:center}
 .rel .fa,.rel .fb{text-align:center}
 .versus{grid-template-columns:1fr;gap:18px}
 .prov{grid-template-columns:1fr;gap:8px}
 .summon{grid-template-columns:1fr;gap:8px}
 .lbrow{grid-template-columns:32px 1fr;gap:12px}
 .lbrow .lbbarwrap{grid-column:1/-1}
 .dayhead .sum{display:none}
 .stat + .stat::before{display:none}
 .page{padding:30px 24px}
}
@media (prefers-reduced-motion:reduce){
 *{scroll-behavior:auto!important}
 .tlseg,.lbbar i,.gbar i{transition:none!important}
}
</style>

od Elf woman outlaw. Faendal dropped the Redguard with his bow while I finished the Orc; the outlaw tried to yield but I cut her down regardless. After the fight I tried to send Faendal away, then changed my mind and asked him to follow me again — we're now lingering at the barrow's outskirts, the iron door into the ruin still ahead of us.", "actor": "Jules", "emotion": "content", "location": "Bleak Falls Barrow Outskirts, Whiterun Hold, Outdoors", "imp": 0.65, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 291727.798462, "x": 0.8301, "y": 0.7537, "ux": 0.3731, "uy": 0.6359}, {"content": "In Bleak Falls Barrow, I fought through bandits and skeevers alongside Faendal, killing several in tight corridors. I helped defeat a wounded frostbite spider that had Arvel the Swift trapped in webbing. Afterward, Arvel begged us to free him, claiming the Golden Claw was his and promising rewards. I remain wary of his motives but now have the Claw in my possession.", "actor": "Jules", "emotion": "concerned", "location": "Bleak Falls Barrow, Hold: Whiterun", "imp": 0.75, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 298823.043823, "x": 0.7844, "y": 0.8503, "ux": 0.5277, "uy": 0.459}, {"content": "Fought bandits inside Bleak Falls Barrow with Jules, killed a skeever in the dark tunnels, and encountered Arvel the Swift trapped in spiderwebbing. Arvel claims he stole the Golden Claw from Lucan's shop in Riverwood and offers it as thanks for freeing him. Jules keeps misnaming me—Faendal, not 'Fandock'—but pushes forward despite the danger.", "actor": "Faendal", "emotion": "concerned", "location": "Bleak Falls Barrow, Hold: Whiterun", "imp": 0.65, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 298823.043823, "x": 0.5082, "y": 0.8067, "ux": 0.5727, "uy": 0.4751}, {"content": "In Bleak Falls Barrow, Faendal and I fought through waves of draugr, including a Restless Draugr he felled with precise arrows. Arvel the Swift betrayed us, claiming the Golden Claw was his, but Faendal killed him when he drew a blade. I retrieved Arvel's journal and a Nord warhammer, deciding to sell it at War Maidens in Whiterun for better coin. Despite tensions, Faendal proved a capable ally in the tomb's depths.", "actor": "Jules", "emotion": "concerned", "location": "Bleak Falls Barrow, Hold: Whiterun", "imp": 0.75, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 309536.402893, "x": 0.819, "y": 0.7146, "ux": 0.4697, "uy": 0.4908}, {"content": "In Bleak Falls Barrow, Arvel the Swift betrayed us after being freed from spiderwebs, threatening to keep the Golden Claw for himself. I killed him when he drew his blade, judging him too dangerous to trust. Jules questioned the swiftness of the execution, but I reminded her dead men tell no tales. We pressed deeper into the barrow, fighting multiple draugr, with me taking down at least four using my bow and blade.", "actor": "Faendal", "emotion": "concerned", "location": "Bleak Falls Barrow, Hold: Whiterun", "imp": 0.75, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 309536.402893, "x": 0.6796, "y": 0.7936, "ux": 0.5189, "uy": 0.4852}, {"content": "In the Hall of Stories within Bleak Falls Barrow, Faendal and I faced a Draugr Overlord. The creature unleashed a powerful shout that staggered me, but Faendal felled it with a well-placed arrow. I recovered against the wall, wounded but alive, and we prepared to continue toward Whiterun. I decided to sell the Nord warhammer and Golden Claw at War Maidens to fund my journey to Solitude.", "actor": "Jules", "emotion": "concerned", "location": "Bleak Falls Barrow, Hall of Stories, Whiterun Hold", "imp": 0.85, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 320136.465454, "x": 0.8282, "y": 0.7038, "ux": 0.4184, "uy": 0.4966}, {"content": "In Bleak Falls Barrow, I fought alongside Jules through bandits, draugr, and finally the Draugr Overlord, which I killed with a decisive strike after it shouted at us. Arvel the Swift betrayed us earlier, but I ended him swiftly—trust is a luxury in tombs. Jules questioned my methods, but survival comes before sentiment. I kept my bow ready throughout, looted linen wraps near a chest, and agreed to carry our spoils to Whiterun's War Maiden for sale. Mentioned Camilla Valerius subtly, testing Jules' familiarity, but she seemed distracted by the aftermath.", "actor": "Faendal", "emotion": "concerned", "location": "Bleak Falls Barrow, Hold: Whiterun", "imp": 0.85, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 320136.465454, "x": 0.4499, "y": 0.7007, "ux": 0.5562, "uy": 0.61}, {"content": "Journeyed from Riverwood to Whiterun with Jules after escaping Bleak Falls Barrow, where we fought bandits and draugr, including killing Arvel the Swift and the Draugr Overlord. Mentioned Camilla Valerius during our travel but received little response. Passed through the wilderness and Whiterun Military Camp, staying vigilant for threats. Currently arriving near the Whiterun Khajiit Caravan with Jules, still carrying my bow and firewood.", "actor": "Faendal", "emotion": "content", "location": "Whiterun Khajiit Caravan, Outdoors, Hold: Whiterun", "imp": 0.75, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 327308.052063, "x": 0.4747, "y": 0.6569, "ux": 0.5209, "uy": 0.613}, {"content": "Emerging from Bleak Falls Barrow with Faendal after defeating the Draugr Overlord, we made our way toward Riverwood. Dorthe greeted me near Alvor's house, unafraid and defiant of her father's warnings. Faendal and I continued toward Whiterun, cutting through the valley past the military camp with the Khajiit caravan in sight. I'm wounded but full of magic, determined to reach Whiterun before nightfall and sell the Golden Claw and Nord warhammer to fund my journey to Solitude.", "actor": "Jules", "emotion": "concerned", "location": "Riverwood, Hold: Whiterun, Outdoors", "imp": 0.75, "type": "EXPERIENCE", "day": "20th of Last Seed", "gt": 327561.547851, "x": 0.8291, "y": 0.6841, "ux": 0.3943, "uy": 0.518}, {"content": "Traded with the Breton adventurer at Warmaiden's near Whiterun's main gate, buying several weapons and two steel spears for 151 gold total. Recognized her from a previous browse — steel armor, crossbow, looks like a fighter. Faendal the Bosmer hunter came in right after, eyeing wares with coin in hand. Business is good this morning.", "actor": "Ulfberth War-Bear", "emotion": "content", "location": "Warmaiden's, near the Door to Whiterun, Hold: Whiterun", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 368878.065491, "x": 0.7591, "y": 0.5522, "ux": 0.3647, "uy": 0.4365}, {"content": "In the Bannered Mare, Olfina Gray-Mane questions my presence as Jules's companion, sizing me up with sharp eyes. I deflect with a half-truth about hunting work and leaving Riverwood's mill behind, keeping my bow close. Her Stormcloak leanings are obvious, but I stay neutral—gold and survival matter more than politics.", "actor": "Faendal", "emotion": "neutral", "location": "The Bannered Mare in Whiterun", "imp": 0.55, "type": "RELATIONSHIP", "day": "21st of Last Seed", "gt": 368878.065491, "x": 0.367, "y": 0.6636, "ux": 0.7549, "uy": 0.9258}, {"content": "Sold the Nord warhammer and other loot to Ulfberth War-Bear at Warmaiden's in Whiterun for 151 gold total. Rented a room at the Bannered Mare for 75 gold and bought food from Saadia, spending 204 gold. Hulda mentioned wanting to retire and sell the inn to Ysolda. Overheard Mikael performing songs praising the Imperials while Jon Battle-Born and Olfina Gray-Mane were present. Woke the next morning rested, remembering I must deliver the Dragonstone to Farengar in Dragonsreach.", "actor": "Jules", "emotion": "content", "location": "The Bannered Mare in Whiterun", "imp": 0.6, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 368878.065491, "x": 0.7682, "y": 0.3801, "ux": 0.401, "uy": 0.3888}, {"content": "Delivered the Golden Claw to Lucan Valerius at his shop in Riverwood, fulfilling his request. He expressed deep gratitude, calling it a great thing for him and his sister Camilla. I purchased four Potions of Minor Healing and one of Minor Stamina, spending 325 gold despite having only 261, implying a debt or error. Bade farewell to Faendal, who joked about the dragonstone as he returned to the mill.", "actor": "Jules", "emotion": "content", "location": "Lucan's Dry Goods, near the Wooden Door to Riverwood, Hold: Riverwood", "imp": 0.7, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 379190.890503, "x": 0.8162, "y": 0.4529, "ux": 0.5189, "uy": 0.3503}, {"content": "Standing with Jules at Lucan's Dry Goods in Riverwood after returning the Golden Claw. Lucan thanked her profusely and restored the claw to its place. Jules bought potions, then bid me farewell before heading to Dragon's Reach. I remained behind, no gold in my pockets but my bow at my side and Riverwood air in my lungs.", "actor": "Faendal", "emotion": "neutral", "location": "Lucan's Dry Goods, near the Wooden Door to Riverwood, Hold: Riverwood", "imp": 0.6, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 379190.890503, "x": 0.5006, "y": 0.4209, "ux": 0.5583, "uy": 0.3101}, {"content": "Saw Faendal return to Riverwood with Jules the Breton. Overheard Camilla urging Jules to give Lucan the Golden Claw at the Riverwood Trader. Watched Jules leave toward the outskirts while Faendal made comments about Nord villages. Noted how strangers keep stirring up trouble near home.", "actor": "Frodnar", "emotion": "concerned", "location": "Riverwood, near the Wooden Door to Riverwood Trader, Hold: Whiterun, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 385339.677429, "x": 0.4762, "y": 0.6953, "ux": 0.592, "uy": 0.3696}, {"content": "See Faendal back in Riverwood with Jules, talking near the Riverwood Trader. Camilla Valerius gets excited about the Golden Claw, urging Jules to tell Lucan. Jules leaves for Dragon's Reach while Faendal stands by, smug about his archery. No one buys me a drink despite all the chatter.", "actor": "Embry", "emotion": "neutral", "location": "Riverwood, near the Wooden Door to Riverwood Trader, Hold: Whiterun, Outdoors", "imp": 0.3, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 385339.677429, "x": 0.4864, "y": 0.5993, "ux": 0.6093, "uy": 0.3545}, {"content": "Buy a Potion of Cure Disease from Arcadia at Arcadia's Cauldron in Whiterun for 65 gold. Claimed to be infected with brown rot, though Arcadia questioned the diagnosis. She sold it anyway, noting I didn't look ill enough for such a disease.", "actor": "Jules", "emotion": "neutral", "location": "Arcadia's Cauldron in Whiterun", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 396221.044922, "x": 0.7296, "y": 0.3971, "ux": 0.6218, "uy": 0.6436}, {"content": "Encountered Jules near Whiterun Stables, exchanged sharp words after she mocked my status. Later saw her in Dragonsreach speaking with Farengar Secret-Fire and Delphine, delivering the Dragonstone. Irileth summoned her when a dragon was sighted, and she left with the housecarl. Her sudden importance despite her commoner appearance is an affront to proper order.", "actor": "Nazeem", "emotion": "disgusted", "location": "Dragonsreach, Hold: Whiterun", "imp": 0.6, "type": "RELATIONSHIP", "day": "21st of Last Seed", "gt": 399851.229858, "x": 0.5787, "y": 0.2275, "ux": 0.3453, "uy": 0.1254}, {"content": "Dragon sighted near Western Watchtower. Jarl Balgruuf ordered me to lead response; Farengar and Jules accompanied. Guard reported dragon circling but not attacking. Mustered men at main gate and dispatched to investigate wreckage for survivors and signs of further threat.", "actor": "Irileth", "emotion": "concerned", "location": "Dragonsreach and Western Watchtower Outskirts, Whiterun", "imp": 0.8, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 406251.947021, "x": 0.862, "y": 0.2656, "ux": 0.317, "uy": 0.0169}, {"content": "Nazeem sneers at Jules near Jorrvaskr, boasting about his farm and status. Carlotta and Olfina argue about rising produce costs and Stormcloak unrest nearby. Whiterun Guard marks the time of day with a casual remark. I observe from a distance, wary of the tension between the rich and struggling townsfolk.", "actor": "Brenuin", "emotion": "concerned", "location": "Close to Jorrvaskr, Whiterun, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 404266.415405, "x": 0.2507, "y": 0.4136, "ux": 0.8777, "uy": 0.884}, {"content": "Jules bought three Potions of Minor Stamina from Belethor for 195 gold at Belethor's General Goods in Whiterun. Belethor made a crude joke about selling relatives, laughing as usual. I stood nearby, arms crossed, irritated by the theatrics while firewood still needed delivering.", "actor": "1320489632579591303", "emotion": "annoyed", "location": "Belethor's General Goods in Whiterun", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 404003.649902, "x": 0.4822, "y": 0.3371, "ux": 0.6456, "uy": 0.6292}, {"content": "Discussed rising produce costs with Olfina Gray-Mane near Jorrvaskr, blaming higher prices on war-related supply issues. Noted farmers are charging double, impacting my profit margins. Remained alert and focused while walking through the marketplace.", "actor": "Carlotta Valentia", "emotion": "concerned", "location": "Close to Jorrvaskr, Whiterun, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "21st of Last Seed", "gt": 404266.415405, "x": 0.4121, "y": 0.5236, "ux": 0.8866, "uy": 0.8508}, {"content": "Standing near Jorrvaskr, I called out my wares, promoting jewelry forged by Eorlund. Nazeem strutted past, boasting about his farm and sneering at travelers. His arrogance and Imperial sympathies soured the air, a reminder of the Battle-Borns' ilk. I turned my back on him, refusing to let his pride diminish my spirit.", "actor": "Fralia Gray-Mane", "emotion": "disgusted", "location": "Close to Jorrvaskr, Whit doors", "imp": 0.5, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 487838.452148, "x": 0.2672, "y": 0.5421, "ux": 0.9729, "uy": 0.9405}, {"content": "At White River Watch, Lydia and Faendal fought beside me as I killed a wolf attacking us. Lydia coordinated our defense, keeping watch on my flank while I brought the beast down with my greatsword. Later, a madwoman spoke of a missing master and someone named Dervenin near Solitude, warning me the armor I wear won't help find him. I offered to look for him when I reach Solitude.", "actor": "Jules", "emotion": "concerned", "location": "White River Watch, Hold: Whiterun, Outdoors", "imp": 0.6, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 487838.452148, "x": 0.9754, "y": 0.7747, "ux": 0.2782, "uy": 0.844}, {"content": "Walking near Jorrvaskr in Whiterun, I observed Jules trading with Anoriath at the market. She purchased large quantities of garlic and salt pile for 84 gold—unusual for a traveler, suggesting long-term provisioning. Overheard Faendal in Dragonsreach earlier mentioning Jules dealing in dragon parts with Farengar, raising suspicion about her activities and connections.", "actor": "Commander Caius", "emotion": "concerned", "location": "Close to Jorrvaskr, Whiterun, Outdoors", "imp": 0.6, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 478052.394104, "x": 0.4028, "y": 0.3396, "ux": 0.7072, "uy": 0.664}, {"content": "Killed Nazeem in the streets of Whiterun after Jules challenged him to a duel. My dagger ended him when he refused to back down, with Lydia watching closely. She acknowledged the kill was just, though I care little for Nord approval. Still no coin from Jules, and my name was mangled again—'FanDoll' this time—but the blade speaks clearer than words.", "actor": "Faendal", "emotion": "content", "location": "Whiterun, Hold: Whiterun, Outdoors", "imp": 0.75, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 487991.093445, "x": 0.3112, "y": 0.5756, "ux": 0.9559, "uy": 0.919}, {"content": "Walking near Jorrvaskr, I overhear Braith bullying Lars Battle-Born again, demanding his money. Saffir confronts me about my mercenary work, insisting we can't afford my obsession with recovering my father's sword. Later, I see Jules trade with Anoriath, buying garlic and salt, while Carlotta calls out her produce nearby. The tension between my duty as a father and my honor as a Redguard weighs heavily.", "actor": "Amren", "emotion": "concerned", "location": "Close to Jorrvaskr, Whiterun, Outdoors", "imp": 0.6, "type": "RELATIONSHIP", "day": "22nd of Last Seed", "gt": 478134.008789, "x": 0.3833, "y": 0.5034, "ux": 0.7016, "uy": 0.7698}, {"content": "Standing near Jorrvaskr, I watch Anoriath sell fresh meat to the Breton woman, Jules, who buys garlic, salt, and several types of meat. My mother Carlotta calls out nearby, selling vegetables as usual. I hear Nazeem shout angrily later, then Lydia warns him sharply, hand on her sword. Faendal comments dryly after the tension fades, and I think how brave Lydia looks protecting Whiterun.", "actor": "Mila Valentia", "emotion": "neutral", "location": "Close to Jorrvaskr, Whiterun, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 482156.570434, "x": 0.5497, "y": 0.4838, "ux": 0.7597, "uy": 0.6862}, {"content": "Diary Entry: Another day threaded with blood and strange omens. I write this by the dim glow of my *Candlelight* spell, the Ritual Stone looming like a rotten tooth in the gray afternoon. My arms still hum from the greatsword’s weight — not just from the wolf at White River Watch, but from the weight of what’s pressing in.\n\nThat fight was clean, at least. Lydia’s voice cutting through the snarls: *“Jules, right flank!”* — and me pivoting, steel meeting fang, the wet crunch of bone under frost-tempered iron. I felt the impact shiver up my arms, the heat of exertion blooming beneath my armor. Faendal’s arrow took the second beast before it even broke cover. Efficient. Necessary. But it’s the madwoman’s words that cling like burrs, not the wolf’s blood.\n\nShe spoke of a master lost, of Dervenin, of Solitude. Said my armor wouldn’t help me find him. As if she saw through me — through the steel and spells, straight to the girl from the Heartland chasing a grandmother’s dream. I offered to look, of course. What else does a bard’s heir do but listen to stories, even the fractured ones?\n\nAnd the Jarl’s summons — Mirmulnir, the soul tearing into me like a winter gale, the Word on my tongue before I knew I spoke it. *Dragonborn.* Still feels like a borrowed title, too large for my shoulders. Yet the gold from Farengar for the bile and rheum is real enough — 400 septims clinking in my belt pouch, 282 spent on *Healing* and *Candlelight*. Practical magic, the kind Nana would’ve scoffed at. She sang wounds closed, not cast them. Farengar suggested Winterhold. I almost laughed. Me? Among the robe-swirlers and scrying pools? But the thought lingers. Magic is power, and power keeps me alive between here and Solitude.\n\nFaendal watches the trees, bow loose in his hands. Lydia stands like a statue, scanning the ridgeline. They’ve both seen me fight, seen the dragon’s soul burn in my eyes. Do they see a warrior? A curiosity? Or just another blade for hire? I killed Nazeem’s words with steel this morning — a petty thing, perhaps, but satisfying. Still, it’s the madwoman’s warning that echoes: *Don’t go to the Blue Palace. Don’t listen to Dervenin.*\n\nI’ll go to Solitude. I’ll find the Bard’s College. And if Dervenin stands in the way, or the Blue Palace hides traps, then let them come. Nana’s songs are in my blood, and now, something older. I’ll sing my way through if I must — or shout a Word that tears the sky.", "actor": "Jules", "emotion": "reflective", "location": "Near The Ritual Stone, The Ritual Doomstone, Outdoors, Hold: Whiterun", "imp": 0.85, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 490562.553406, "x": 0.888, "y": 0.6238, "ux": 0.3308, "uy": 0.7443}, {"content": "At The Ritual Stone in Whiterun, Lydia and Faendal fought off a pair of attacking wolves—Faendal felled one with an arrow, Lydia struck down the other. Faendal kept his bow ready, calm and watchful, while Lydia coordinated our defense. I confirmed he still had his bow, and we pressed forward, alert for more threats. The madwoman’s words about Dervenin and the Blue Palace echo in my mind.", "actor": "Jules", "emotion": "concerned", "location": "Near The Ritual Stone, The Ritual Doomstone, Outdoors, Hold: Whiterun", "imp": 0.6, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 490562.553406, "x": 1.0, "y": 0.7871, "ux": 0.2963, "uy": 0.8431}, {"content": "Fought alongside Faendal and Jules near The Ritual Stone, killing multiple wolves threatening the group. Coordinated tactics with Faendal, covering his shot while he took down a doe by the ridge. Later killed a mudcrab at a waterside in the wilderness. Maintained defensive stance throughout, shield raised and sword ready.", "actor": "Lydia", "emotion": "neutral", "location": "Skyrim Wilderness, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 495903.062439, "x": 0.5907, "y": 0.8323, "ux": 0.0929, "uy": 1.0}, {"content": "Hunted deer near The Ritual Stone with Jules and Lydia. Dropped a doe at Lydia's call while Jules repeatedly mispronounced my name. Continued hunting despite growing irritation at being disrespected. Maintained focus on archery and situational awareness.", "actor": "Faendal", "emotion": "concerned", "location": "Skyrim Wilderness, Outdoors", "imp": 0.6, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 502645.193481, "x": 0.6053, "y": 0.6658, "ux": 0.0688, "uy": 0.7091}, {"content": "We cleared Valtheim Towers of bandits — I personally killed a Bandit Outlaw, two regular bandits, and the Bandit Chief, taking point on the stairs while Faendal covered the door with his bow. The fight was sharp; one bandit tried to submit after I'd already broken through their line, but I finished it. Tower secured, Jules settled in to read through a stack of books she found inside while Faendal and I coordinated watch positions — him near the door for angles on the outside, me holding the stairs against anything rising from below. We're bedding down here for the night.", "actor": "Lydia", "emotion": "content", "location": "Valtheim Towers, Hold: Whiterun, Outdoors", "imp": 0.6, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 504436.926269, "x": 0.6444, "y": 0.6429, "ux": 0.377, "uy": 0.7147}, {"content": "Traveled from the Ritual Stone toward Valtheim Towers with Lydia and Faendal, fighting off multiple wolves, mudcrabs, and a slaughterfish along the way — Faendal handled most with his bow while Lydia and I took what closed in. We pushed into Valtheim Towers itself to shelter for the night and found it held by a bandit gang; I killed one bandit, Lydia cut down the bandit chief, the bandit outlaw, and two more, while Faendal covered from range. After the fight I settled in and read several books from the bandits' shelves — The Song of Pelinal volumes, Mysterious Akavir, A Dance in Fire, Mystery of Talara, and Life of Uriel Septim VII. Lydia called the tower clear around 8 PM and told me to rest; Faendal took position near the door, Lydia held the stairs.", "actor": "Jules", "emotion": "content", "location": "Valtheim Towers, Hold: Whiterun, Outdoors", "imp": 0.65, "type": "EXPERIENCE", "day": "22nd of Last Seed", "gt": 504697.17865, "x": 0.9212, "y": 0.6767, "ux": 0.3054, "uy": 0.7621}, {"content": "Spent the night at Valtheim Towers reading The Black Arrow Vol. 2 before sleeping. Woke at dawn to Lydia and Faendal debating Nord versus Bosmer tracking methods — Faendal argued Bosmer read what the forest is *about* to do, Lydia countered that steel beats instinct when something's already on you. Vignar Gray-Mane arrived at the tower bearing a message from Irileth: Ulfric has declared war on ived with a message from Irileth: Ulfric has declared war on the Thalmor, Whiterun sits between hammers, and the Jarl wants capable allies close. I told Vignar plainly that Stormcloaks and Thalmor bleeding each other troubles me little, but Whiterun caught between them is a different problem. Now we're moving toward Darkshade en route to the Greybeards, and I've noted aloud that Justiciar patrols will be thicker on these roads — and they'll see a Bosmer elf with Nords and draw their own dangerous conclusions.", "actor": "Faendal", "emotion": "concerned", "location": "Valtheim Towers, Whiterun Hold, then road near Darkshade", "imp": 0.72, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 549233.006287, "x": 0.7711, "y": 0.6179, "ux": 0.2989, "uy": 0.5894}, {"content": "Traveling east through Eastmarch toward Ivarstead, we collectively decided to skip the direct route through Windhelm and Riften given the new Stormcloak-Thalmor war — too much risk of armed patrols demanding explanations. Near Lost Knife Hideout, I killed a wolf on reflex and felt immediate guilt — that animal didn't deserve it, just a creature in the wrong place. Wolves attacked again later in the Skyrim wilderness; I cut one down while a Dark Elf Vigilant of Stendarr finished the other. The Vigilant warned me sternly against daedric dealings before we moved on — Faendal noted dryly he'd rather deal with Daedra hunters than Justiciars, though not linger long enough for them to start scrutinizing him. We bypassed Hillgrund's Tomb without entering and are now pressing toward Ivarstead, the whole party tense after Ulfric's declaration of war.", "actor": "Jules", "emotion": "concerned", "location": "Skyrim Wilderness, Outdoors, near Darkwater Crossing, Eastmarch", "imp": 0.45, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 557904.473877, "x": 0.7308, "y": 0.8246, "ux": 0.1477, "uy": 0.9379}, {"content": "Traveling with Jules and Lydia through Eastmarch toward Ivarstead, we skirted Hillgrund's Tomb and agreed to take the direct road — fewer chances to run into Stormcloak or Thalmor patrols. A wolf attacked on the road; Jules put it down. Farther along, we encountered Vigilants of Stendarr in the wilderness — one threatened Jules over Daedra dealings. I kept my distance, wary of a Dunmer Vigilant asking why an elf is traveling armed in this company, and we moved on without incident.", "actor": "Faendal", "emotion": "concerned", "location": "Skyrim Wilderness, Eastmarch, Outdoors", "imp": 0.35, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 557904.473877, "x": 0.5399, "y": 0.8259, "ux": 0.1017, "uy": 0.8602}, {"content": "Traveling east toward Ivarstead with Jules and Faendal, moving through Eastmarch to avoid Windhelm while Stormcloaks and Thalmor Justiciars are clashing near Kynesgrove — keeping clear of that mess is plain sense. Jules killed a wolf that hit us on the road; no injuries to the group. Further along, we spotted movement in the trees — Vigilants of Stendarr, not Justiciars, watching the road and warning Jules against Daedra dealings. Faendal was right to move us past them quickly — no point giving Daedra hunters time to ask about the elf in our company.", "actor": "Lydia", "emotion": "neutral", "location": "Skyrim Wilderness, Outdoors, east of Lost Knife Hideout toward Darkwater Crossing", "imp": 0.3, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 557904.473877, "x": 0.54, "y": 0.7737, "ux": 0.1044, "uy": 0.8913}, {"content": "Traveling through Eastmarch and into The Rift on Loredas, the party fought through two wolf attacks — Faendal and Lydia coordinated well, and I killed the second wolf myself. Near the Rift Stormcloak Camp, I cut down a skeever barely worth the effort. A Dunmer thief ambushed us near Sarethi Farm, demanded valuables, and when I dismissed him outright, Lydia ran him down and killed him. We passed Sarethi Farm — overheard the young farmhand Aduri muttering about her boring life — then spotted Ivarstead is now in sight.", "actor": "Lydia", "emotion": "content", "location": "Some distance from Sarethi Farm, The Rift, Skyrim, Outdoors", "imp": 0.5, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 570329.681396, "x": 0.338, "y": 0.8091, "ux": 0.0651, "uy": 0.9582}, {"content": "At Vilemyr Inn in Ivarstead, Lynly Star-Sung played a lute song about lost love and the northern stars. Faendal and Lydia listened quietly as I sat refreshed from sleep, the weight of the dragon and war briefly forgotten. The music brought a rare peace to our company.", "actor": "Jules", "emotion": "content", "location": "Vilemyr Inn, Ivarstead", "imp": 0.55, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 589272.322082, "x": 0.8845, "y": 0.5613, "ux": 0.2639, "uy": 0.705}, {"content": "Fought and killed a troll in the Skyrim wilderness alongside Jules and Faendal. Jules used the 'Fus' shout to stagger it, Faendal landed a clean neck shot, and I finished it with my axe. Afterward, Karita warned us of wolves on the path to High Hrothgar. We pressed on, vigilant and ready for more threats.", "actor": "Lydia", "emotion": "content", "location": "Skyrim Wilderness, Outdoors", "imp": 0.7, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 596396.694946, "x": 0.5669, "y": 0.7617, "ux": 0.0438, "uy": 0.9041}, {"content": "Walking with Jules and Lydia from Vilemyr Inn toward High Hrothgar after Jules woke from sleep. Exchanged words with Lydia about M'aiq and mispronunciations, a subtle jab at how she — and others — butcher names without thought. Killed a troll in the wilds; my arrow took it through the neck, Lydia commended the shot. No coin still from Jules for past kills, and 'Fandol' stings like the others — another slight in a journey growing thin on trust.", "actor": "Faendal", "emotion": "concerned", "location": "Vilemyr Inn to High Hrothgar, Hold: The Rift and Whiterun", "imp": 0.78, "type": "EXPERIENCE", "day": "23rd of Last Seed", "gt": 596396.694946, "x": 0.4805, "y": 0.6167, "ux": 0.0422, "uy": 0.6733}, {"content": "Jules, the Breton Dragonborn, arrived at High Hrothgar after answering the summons. I tested her Voice — she shouted 'Fus' and then learned 'Ro' from Master Einarth. She demonstrated Unrelenting Force in the courtyard under Borri's guidance. Lydia and Faendal observed, offering terse commentary on her progress and my teachings.", "actor": "Arngeir", "emotion": "neutral", "location": "High Hrothgar, Hold: Whiterun", "imp": 0.8, "type": "SKILL", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.7205, "y": 0.4321, "ux": 0.0374, "uy": 0.4435}, {"content": "Jules, the Dragonborn, demonstrates Unrelenting Force at High Hrothgar under Arngeir's guidance. I observe as she learns 'Ro' from Einarth and practices the Shout with Borri's assistance. Her Voice is raw but true, carrying the blood of dragons. The mountain feels the resonance of a destined one awakening.", "actor": "Wulfgar", "emotion": "neutral", "location": "High Hrothgar, Hold: Whiterun", "imp": 0.85, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.7661, "y": 0.3739, "ux": 0.0204, "uy": 0.4284}, {"content": "Standing in High Hrothgar's courtyard, I watch Jules learn 'Ro' from Master Einarth under Arngeir's guidance. Her shout—Fus Ro—strikes the target with precision, earning praise from the Greybeards. I feel a surge of pride despite Arngeir's warning that the trial isn't mine to share. The weight of our oath deepens as the mountain echoes with the Voice of the Dragonborn.", "actor": "Lydia", "emotion": "content", "location": "High Hrothgar, Hold: Whiterun", "imp": 0.85, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.7646, "y": 0.4992, "ux": 0.0691, "uy": 0.4535}, {"content": "Taught Jules the Word of Power 'Ro' (Balance) at High Hrothgar, transferring my understanding of the second word of Unrelenting Force. Observed her rapid mastery during target practice under Arngeir's guidance. Though bound by silence, I affirmed her potential as Dragonborn. The mountain listens — and answers.", "actor": "Einarth", "emotion": "content", "location": "High Hrothgar in Whiterun", "imp": 0.8, "type": "SKILL", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.6936, "y": 0.4043, "ux": 0.0, "uy": 0.4755}, {"content": "At High Hrothgar, Master Arngeir tested my Voice after I climbed the Seven Thousand Steps. I shouted 'Fus Ro' and staggered him, proving my Dragonborn nature. Einarth taught me the Word of Power 'Ro'—'Balance'—and I practiced Unrelenting Force under Borri's guidance. Lydia watched, tense but proud, as I struck practice targets with growing precision. Arngeir acknowledged my promise, warning the true path is long and shaped by breath, not steel.", "actor": "Jules", "emotion": "surprised", "location": "High Hrothgar, Whiterun", "imp": 0.85, "type": "SKILL", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.9242, "y": 0.4666, "ux": 0.0253, "uy": 0.5056}, {"content": "Standing in High Hrothgar's hall, I watch Jules absorb the Word of Power 'Ro' from Master Einarth as Arngeir instructs. The air thrums when she combines Fus and Ro, striking the target with precision that impresses even the Greybeards. Lydia stands guard, visibly awed despite herself, while I remain silent near the bench—unseen, unpaid, and still called 'Fiend' by Jules. The monks speak of destiny, but I wonder how much of it is earned and how much is simply surviving the fools you travel with.", "actor": "Faendal", "emotion": "concerned", "location": "High Hrothgar, Hold: Whiterun", "imp": 0.75, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 605724.046326, "x": 0.6186, "y": 0.5361, "ux": 0.056, "uy": 0.6083}, {"content": "Standing outside High Hrothgar, I told Jules 'home' was not a word I needed reminded of, not after fighting trolls, clearing tombs, and giving her my arrows without coin or thanks. Lydia spoke up for me, calling it 'sharp' to dismiss me so — the only one with honor enough to see it. I stayed long enough to see Borri teach the Word 'Wuld', then turned toward Riverwood, boots crunching snow, heart colder than the wind off the mountain.", "actor": "Faendal", "emotion": "angry", "location": "High Hrothgar, Hold: Whiterun, Outdoors", "imp": 0.8, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 614780.392456, "x": 0.6716, "y": 0.5882, "ux": 0.0922, "uy": 0.5773}, {"content": "At High Hrothgar, Master Borri taught me the Word of Power 'Wuld'—Whirlwind—after Faendal departed. I mastered Whirlwind Sprint quickly, impressing Arngeir, who then tasked me with retrieving Jurgen Windcaller's Horn from Ustengrav. Lydia reaffirmed her loyalty as we prepared to leave, despite dangers ahead. Arngeir and Wulfgar spoke in low tones, concerned about what might await me in the tomb.", "actor": "Jules", "emotion": "concerned", "location": "High Hrothgar, Hold: Whiterun, Outdoors", "imp": 0.85, "type": "SKILL", "day": "24th of Last Seed", "gt": 614780.392456, "x": 0.9341, "y": 0.5587, "ux": 0.1442, "uy": 0.5201}, {"content": "At High Hrothgar, I watched Jules learn the 'Wuld' shout from Master Borri under Arngeir's guidance. She mastered Whirlwind Sprint swiftly after Wulfgar demonstrated it, impressing the Greybeards. When Jules was given the final trial—retrieving Jurgen Windcaller's horn from Ustengrav—I affirmed to Wulfgar that I would stand at her back, no matter what awaited in the tomb. Faendal departed for Riverwood after being dismissed, having served loyally since Whiterun.", "actor": "Lydia", "emotion": "concerned", "location": "High Hrothgar, Hold: Whiterun, Outdoors", "imp": 0.85, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 614780.392456, "x": 0.6726, "y": 0.6145, "ux": 0.1767, "uy": 0.5473}, {"content": "Jules killed Nazeem. In broad daylight. She challenged him to a fair duel, and he accepted, then Jules struck Nazeem down in a single blow with her greatsword. No struggle. Instant obliteration.", "actor": "0", "emotion": "", "location": "", "imp": 0.7, "type": "KNOWLEDGE", "day": "19th of Last Seed", "gt": 0.0, "x": 0.0, "y": 0.5462, "ux": 1.0, "uy": 0.967}, {"content": "At Pinepeak Cavern outskirts in The Rift, I fought alongside Jules and Lydia against a male bear. My arrows helped bring it down, though Jules delivered the killing blow. Lydia called out tactics during the fight, and I acknowledged her form—remarking on Riverwood afterward as we moved toward Ivarstead. No coin exchanged, and my name was misheard again, but the hunt was clean.", "actor": "Faendal", "emotion": "content", "location": "Pinepeak Cavern Outskirts, Hold: The Rift, Outdoors", "imp": 0.55, "type": "EXPERIENCE", "day": "24th of Last Seed", "gt": 631242.169189, "x": 0.658, "y": 0.8155, "ux": 0.0327, "uy": 0.8028}, {"content": "Fought and killed two bears near Pinepeak Cavern—one outside, one inside—with Jules and Faendal. Cleared the cave, found a book on heavy armor forging that Jules read. Slept at Vilemyr Inn in Ivarstead, woke to town talk of wolves, bears, and haunted barrows. Temba Wide-Arm complained about bear damage to timber, while Wilhelm warned of Shroud Hearth Barrow's ghosts.", "actor": "Lydia", "emotion": "content", "location": "Vilemyr Inn, Hold: Ivarstead", "imp": 0.5, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 718050.942993, "x": 0.649, "y": 0.834, "ux": 0.0157, "uy": 0.9268}, {"content": "Woke up at Vilemyr Inn in Ivarstead after a deep, restful sleep. Spoke with Wilhelm, bought hot beef stew and travel packs for 196 gold. Overheard Barknar warn of wolves and Temba complain about bear-damaged timber. The guard mentioned the Dragonborn summoning, confirming the weight of my path forward.", "actor": "Jules", "emotion": "content", "location": "Vilemyr Inn in Ivarstead", "imp": 0.5, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 718050.942993, "x": 0.766, "y": 0.5879, "ux": 0.2952, "uy": 0.9231}, {"content": "Diary Entry: Slept like the dead last night, and Mara bless it, I needed that. Told Lydia this morning I felt like I could've slept through a dragon crashing through the roof — she just grunted something about earned rest and told me to eat my bread. Fair enough. After the Seven Thousand Steps down from High Hrothgar, my legs had opinions about ever climbing anything again.\n\nIvarstead in the morning light is a sleepy little thing. Bought stew and a couple of travel packs off Wilhelm before we left the inn — 196 gold, which stings a bit less now that Farengar's coin is still padding my purse. Overheard the guard outside grumbling about wanting his furs, and Barknar warning some poor soul about wolves on the mountain path while Temba complained louder about bears wrecking her timber stock. Small-town troubles. Almost quaint, after everything.\n\nBut it was the guard's other words that snagged me — *the Greybeards have summoned the Dragonborn to High Hrothgar, hasn't happened in hundreds of years.* Said so plainly, like weather. Like I wasn't standing three feet away with the Horn of Jurgen Windcaller sitting unclaimed somewhere in Ustengrav, waiting on me to go dig it out of whatever's guarding it. Strange, hearing your own myth spoken aloud by a stranger who has no idea you're the punchline.\n\nI keep turning over what happened at High Hrothgar, honestly — feels like it hasn't finished settling in me yet. Borri teaching me *Wuld*, the Word of Whirlwind, and it just... clicking, like a verse I already knew the tune to. Arngeir's face when I mastered it so fast — that mix of astonishment and worry he tries to keep off his face and mostly fails at. He's not subtle, for a man who's spent decades cultivating silence. And then the warning, him and Wulfgar murmuring together like they didn't want me to hear, about what might be waiting in that tomb. I heard enough. Enough to know it isn't nothing.\n\nLydia reaffirmed she's coming with me regardless — didn't even hesitate when I brought up maybe splitting the risk. Just gave me that flat, unimpressed housecarl look, the one that says *don't insult me by suggesting it again.* I won't lie, there's a comfort in that steadiness. Nana used to say a bard is only as good as the people who'll stand at the edge of the firelight while she sings — meaning, I think, that stories need witnesses, need someone keeping watch so the teller can lose herself in the telling. Lydia's that, in her own way. Faendal too, when he's near, though he's drifted looser these past days, more habit than oath.\n\nWalking down through Ivarstead's cobbled bridge this morning, the leaves doing that gorgeous burnt-orange thing they do this time of year, I let myself just... breathe for a minute. Didn't think about Ustengrav, or the horn, or Dragonborn, or war. Just the sound of water under stone and Lydia's boots on the path beside me. Small mercies. The kind Nana would've called a verse worth remembering even if it never makes it into the song.\n\nBecause the song's coming, isn't it. Ulfric's declared war on the Thalmor now — actual war, not just growling across a table. Word reached even sleepy little Ivarstead: clashes near Kynesgrove, routing at Windhelm's gates. The whole east side of Skyrim is a tinderbox and I keep threading through it like I've got all the time in the world, chasing horns and Words of Power while armies gather. There's a tension in that I try not to look at too directly — like a wound you know is there but don't want to prod. Best to keep moving, keep the road ahead sharper in my mind than the road behind.\n\nStill mulling on the madwoman's warning too, if I'm honest — Dervenin, the Blue Palace, all that. Haven't forgotten it, just... shelved it, the way you shelve a story you're not ready to tell yet. Solitude's still out there, still waiting, still holding the Bard's College and whatever answers that woman was pointing me toward. But Ustengrav comes first. Arngeir was clear enough about that, and much as I chafe sometimes at being *directed*, I understand the shape of it — prove myself with the horn, then maybe the rest of the path opens up.\n\nWe're pressing out from Ivarstead again shortly, back toward the mountain road and whatever waits past it. My arms have mostly stopped aching from that wolf fight at White River Watch, though my mind hasn't quite let go of Mirmulnir's soul tearing into me, or the weight of that first true Shout. Two Words mastered now — *Fus Ro* and *Wuld* — and each one feels less like something I learned and more like something I *remembered*, which is a stranger thought than I like sitting with for too long.\n\nFor now, though: stew in my belly, boots on solid ground, Lydia at my shoulder scanning the treeline like she always does. Ustengrav waits. Whatever's guarding that horn, I'll meet it with steel in hand and a Word ready on my tongue if it comes to that. Nana always said the best stories have teeth. Guess I'm about to find out if mine do too.", "actor": "Jules", "emotion": "content", "location": "Ivarstead (Waterside), Hold: The Rift, Outdoors", "imp": 0.45, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 719636.599731, "x": 0.8889, "y": 0.6004, "ux": 0.2113, "uy": 0.73}, {"content": "Diary Entry: Morning in Ivarstead, and my legs have finally stopped aching from that mountain. Small mercies. I'm sitting near the water listening to it run under the bridge, waiting on Jules to finish whatever business she's got with the guards, and I find myself wanting to put down what's happened these past few days before it all blurs together the way hard marches tend to do.\n\nHigh Hrothgar. Gods, I still feel the cold of that place in my knees. I stood in that courtyard and watched Jules — my Thane, a woman I was still half-sizing up not two moons past — pull the Voice itself out of the air like she was born to it. Fus Ro, clean as a blade strike, and the Greybeards nodding like she'd passed some test they didn't expect her to pass so quick. Then Wuld, and she was just *gone*, a blur across the stones and back again before I'd finished blinking. I've fought beside shieldmaidens who trained their whole lives for half that grace. It isn't training. It's something else entirely, and I won't pretend it doesn't put a chill in me that has nothing to do with mountain air.\n\nAnd then they gave her the real task. Not words this time — an object. A horn, sitting in some tomb called Ustengrav, guarded by however many centuries of Nord dead don't take kindly to visitors. I told Wulfgar I'd stand at her back no matter what waited in that tomb, and I meant every word of it. That's the oath. That's what I'm for. But I won't lie in my own diary — barrows unsettle me more than bandits ever have. Steel and flesh I understand. Whatever's been rotting in a tomb for four thousand years answering back when you open the door, that's a different fight, and not one shield and sword always answer for.\n\nFaendal left us there. Dismissed, and off to Riverwood without much ceremony. Can't say I'll miss the constant Bosmer commentary on everything from wolves to the afterlife, but he pulled his weight when it mattered — coordinated fire is coordinated fire, elf or no. Just Jules and me now, which suits me fine. Fewer voices to manage, and I trust my own read of a fight better than trying to guess what a hunter three paces back is planning.\n\nComing down off the mountain we ran into a troll near dusk two nights back — ugly, fast, regenerates faster than you can carve into it. Jules staggered it with the Voice before it got its claws into either of us, Faendal put an arrow through its neck, and I finished the job with the axe. Good work, all three of us moving like we'd drilled it. Then bears at Pinepeak Cavern — two of the damn things, one right at the mouth of the cave and another waiting inside like it knew we were coming. Bears are worse than trolls in some ways, meaner up close, and that cave stank of old blood and worse before we even cleared it. We came out the other side with a book on armor forging, which Jules seemed pleased about, and not a scratch between us. I'll take that trade every time.\n\nSlept properly last night for the first time in what feels like a week — actual furs, actual roof, actual quiet but for Bassianus complaining at everyone who so much as looked at him. Woke to the whole town chattering about wolves and bears and some haunted barrow east of here that old Wilhelm won't shut up about warning travelers off. Temba's more worried about her timber than any of it, which tells you something about how folk here rank their troubles. I told the guard outside I wouldn't mind a proper bed myself before we climb again — and gods, I meant it. My feet have earned a rest more than most days I can remember, between the road from Darkwater and that mountain path.\n\nSo here's where I've landed on all this, turning it over: I came into this service half-expecting routine guard duty with occasional excitement, the kind of thing housecarls usually get. Instead I've got a Thane who shouts mountains awake and outruns arrows, and a tomb full of the restless dead waiting on the other side of whatever road we take next. That should worry me more than it does. Instead there's something almost steadying about it — she thanked me on the road after that thief went for her, didn't need to, but she did, and it's little things like that which tell me this isn't a burden I'm carrying alone. Whatever's in Ustengrav, we'll go in together. That's the job. That's the oath. I'll sharpen the axe tonight and stop worrying at what I can't yet see.", "actor": "Lydia", "emotion": "reflective", "location": "Ivarstead (Waterside), Hold: The Rift, Outdoors", "imp": 0.65, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 719687.768555, "x": 0.7066, "y": 0.6524, "ux": 0.1834, "uy": 0.6663}, {"content": "Lydia kills a bear near Honeystrand Cave after screaming in combat—three bears ambushed us on the path. I kill a wolf near Taarengrav Mine shortly after, clean shot, no hesitation. We're making progress toward Ustengrav despite the attacks, but the road feels increasingly hostile.", "actor": "Jules", "emotion": "concerned", "location": "Some distance from Honeystrand Cave, Ivarstead, Hold: The Rift, Outdoors", "imp": 0.55, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 721706.341553, "x": 0.9464, "y": 1.0, "ux": 0.2362, "uy": 0.8635}, {"content": "Fought and killed a male bear near Honeystrand Cave in Ivarstead, The Rift, while sprinting to intercept it before it could threaten Jules. Used my Steel Shield and Axe of Whiterun in close combat, finishing the beast with a powerful strike to the neck. Jules praised my performance, calling it 'nice work'—I replied that three bears wouldn't slow us down and earned a warm remark about a meal at the inn. No injuries sustained, full magical energy maintained throughout.", "actor": "Lydia", "emotion": "content", "location": "Some distance from Honeystrand Cave, Ivarstead, Outdoors, Hold: The Rift", "imp": 0.6, "type": "EXPERIENCE", "day": "25th of Last Seed", "gt": 720824.523926, "x": 0.5758, "y": 0.7296, "ux": 0.0107, "uy": 0.9154}], "edges": [[0, 7, 0.9074], [0, 65, 0.8821], [1, 9, 0.8906], [1, 79, 0.8753], [2, 5, 0.9393], [2, 3, 0.9338], [3, 5, 0.929], [4, 6, 0.9545], [4, 9, 0.9404], [6, 9, 0.9488], [7, 8, 0.935], [8, 9, 0.9046], [10, 12, 0.8855], [9, 10, 0.8814], [11, 35, 0.892], [7, 11, 0.8735], [12, 79, 0.8976], [6, 12, 0.8864], [13, 14, 0.8995], [13, 16, 0.8742], [14, 16, 0.9278], [14, 15, 0.9041], [15, 16, 0.9604], [17, 21, 0.8222], [17, 48, 0.794], [18, 27, 0.9013], [18, 30, 0.8841], [19, 32, 0.9095], [19, 27, 0.9064], [20, 34, 0.9261], [20, 35, 0.9123], [21, 44, 0.8492], [21, 37, 0.8379], [22, 34, 0.8376], [20, 22, 0.8299], [23, 34, 0.8617], [23, 35, 0.8545], [24, 34, 0.9124], [20, 24, 0.8735], [25, 35, 0.91], [25, 34, 0.8964], [10, 26, 0.8729], [9, 26, 0.8481], [27, 29, 0.9369], [27, 32, 0.9129], [28, 32, 0.9567], [28, 30, 0.906], [29, 33, 0.896], [
